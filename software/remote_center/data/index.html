<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .controller {
            background: #C0C0C0;
            border-radius: 24px;
            padding: 20px;
            border: 6px solid #1A1A1A;
            position: relative;
            max-width: 680px;
            width: 100%;
        }

        .btn {
            transition: 0.1s;
        }

        .btn:active {
            transform: scale(0.92);
        }

        /* 方向键 */
        .dpad {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            position: relative;
        }

        .dpad-btn {
            position: absolute;
            background: #1A1A1A;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .dpad-up {
            width: 36px;
            height: 52px;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .dpad-down {
            width: 36px;
            height: 52px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .dpad-left {
            width: 52px;
            height: 36px;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .dpad-right {
            width: 52px;
            height: 36px;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .dpad-center {
            width: 36px;
            height: 36px;
            background: #1A1A1A;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* 摇杆 */
        .stick {
            width: 72px;
            height: 72px;
            background: #333;
            border: 4px solid #777;
            border-radius: 50%;
            margin: 10px auto;
            position: relative;
        }

        .stick-dot {
            width: 36px;
            height: 36px;
            background: #1A1A1A;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* 动作键 △○×□ */
        .action {
            width: 120px;
            height: 120px;
            position: relative;
            margin: 0 auto;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
        }

        .tri { background: #1E90FF; top:0; left:50%; transform: translate(-50%, -10%); }
        .cir { background: #D22B2B; right:0; top:50%; transform: translate(10%, -50%); }
        .cro { background: #32CD32; bottom:0; left:50%; transform: translate(-50%, 10%); }
        .squ { background: #FFD700; left:0; top:50%; transform: translate(-10%, -50%); }

        /* 布局 */
        .layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .col {
            flex: 1;
            min-width: 140px;
            text-align: center;
        }

        .small-btn {
            width: 36px;
            height: 12px;
            background: #1A1A1A;
            border-radius: 6px;
            display: inline-block;
        }

        .shoulder {
            width: 60px;
            height: 18px;
            background: #1A1A1A;
            border-radius: 8px;
        }

        .status {
            background: #1A1A1A;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 12px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .status-item {
            background: #333;
            padding: 6px;
            border-radius: 4px;
        }

        .connected {
            background: #E8F8E8;
            color: #090;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap:6px;
            margin-top:16px;
        }

        .dot {
            width:8px; height:8px; background:#0C0; border-radius:50%;
        }
    </style>
</head>

<body>
    <div class="controller">
        <div class="layout">
            <!-- 左侧 -->
            <div class="col">
                <div class="dpad">
                    <div id="up" class="dpad-btn dpad-up">↑</div>
                    <div id="down" class="dpad-btn dpad-down">↓</div>
                    <div id="left" class="dpad-btn dpad-left">←</div>
                    <div id="right" class="dpad-btn dpad-right">→</div>
                    <div class="dpad-center"></div>
                </div>

                <div style="margin-top:24px">
                    <div style="font-size:12px; font-weight:bold">L3</div>
                    <div id="lStick" class="stick">
                        <div id="lDot" class="stick-dot"></div>
                    </div>
                </div>
            </div>

            <!-- 中间 -->
            <div class="col" style="text-align:center">
                <div style="font-size:22px; font-weight:bold; margin-bottom:20px">PS2</div>

                <div style="display:flex; gap:16px; justify-content:center; margin-bottom:10px">
                    <div>
                        <div id="select" class="small-btn btn"></div>
                        <div style="font-size:10px">SELECT</div>
                    </div>
                    <div>
                        <div id="start" class="small-btn btn"></div>
                        <div style="font-size:10px">START</div>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; margin-top:20px">
                    <div id="l1" class="shoulder btn"></div>
                    <div id="r1" class="shoulder btn"></div>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:6px">
                    <div id="l2" style="width:48px;height:12px;background:#333;border-radius:6px" class="btn"></div>
                    <div id="r2" style="width:48px;height:12px;background:#333;border-radius:6px" class="btn"></div>
                </div>
            </div>

            <!-- 右侧 -->
            <div class="col">
                <div class="action">
                    <div id="triangle" class="action-btn tri">△</div>
                    <div id="circle" class="action-btn cir">○</div>
                    <div id="cross" class="action-btn cro">×</div>
                    <div id="square" class="action-btn squ">□</div>
                </div>

                <div style="margin-top:24px">
                    <div style="font-size:12px; font-weight:bold">R3</div>
                    <div id="rStick" class="stick">
                        <div id="rDot" class="stick-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <div style="text-align:center">
            <div class="connected">
                <span class="dot"></span>
                <span>Controller Connected</span>
            </div>
        </div>

        <div class="status">
            <div style="font-weight:bold; margin-bottom:8px">Controller Status</div>
            <div id="statusGrid" class="status-grid">
                <div class="status-item">Ready...</div>
            </div>
        </div>
    </div>

    <script>
        const status = document.getElementById('statusGrid');
        let list = [];

        function addStatus(txt) {
            list.unshift(txt);
            if (list.length > 4) list = list.slice(0, 4);
            status.innerHTML = '';
            list.forEach(s => {
                let d = document.createElement('div');
                d.className = 'status-item';
                d.textContent = s;
                status.appendChild(d);
            });

            // 发送按键到 ESP8266
            sendToESP(txt);
        }

        // 按键绑定
        const keys = [
            'up','down','left','right',
            'triangle','circle','cross','square',
            'select','start','l1','r1','l2','r2'
        ];

        keys.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            
            function on() { addStatus(id.toUpperCase()); }
            el.addEventListener('touchstart', e => { e.preventDefault(); on(); });
            el.addEventListener('mousedown', on);
        });

        // 摇杆简易模拟
        function stick(stickId, dotId, name) {
            const stick = document.getElementById(stickId);
            const dot = document.getElementById(dotId);
            let dragging = false;

            function move(e) {
                if (!dragging) return;
                dot.style.transform = 'translate(-50%, -50%) translate(5px,5px)';
                addStatus(name + " MOVE");
            }

            function end() {
                dragging = false;
                dot.style.transform = 'translate(-50%, -50%)';
            }

            stick.addEventListener('mousedown', () => dragging = true);
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', end);

            stick.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; });
            document.addEventListener('touchmove', e => { e.preventDefault(); move(e); });
            document.addEventListener('touchend', end);
        }

        stick('lStick', 'lDot', 'LEFT');
        stick('rStick', 'rDot', 'RIGHT');

        // 发送数据到 ESP8266
        function sendToESP(cmd) {
            fetch("/?" + cmd);
        }
    </script>
</body>
</html>
