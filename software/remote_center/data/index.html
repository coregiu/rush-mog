<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSH-MOG</title>
    <script src="ps2.js"></script>
    <link href="ps2.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ps2gray: '#C0C0C0',
                        ps2dark: '#333333',
                        ps2red: '#D22B2B',
                        ps2green: '#32CD32',
                        ps2blue: '#1E90FF',
                        ps2yellow: '#FFD700',
                        ps2black: '#1A1A1A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .d-pad {
                @apply relative w-40 h-40 mx-auto;
            }
            .d-pad-button {
                @apply absolute bg-ps2black rounded-md flex items-center justify-center transition-all duration-100 active:scale-90;
            }
            .button-press {
                @apply scale-90 shadow-inner;
            }
            .analog-stick {
                @apply w-20 h-20 rounded-full bg-ps2dark border-4 border-gray-700 relative mx-auto transition-all duration-100;
            }
            .analog-dot {
                @apply absolute w-10 h-10 bg-ps2black rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-100;
            }
            .action-button {
                @apply w-14 h-14 rounded-full flex items-center justify-center text-white font-bold text-lg transition-all duration-100 active:scale-90 shadow-lg;
            }
            .vertical-button {
                @apply flex flex-col items-center gap-1;
            }
            * {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4" onselectstart="return false">
    <div class="max-w-4xl mx-auto">
        <!-- Controller Container -->
        <div class="bg-ps2gray rounded-3xl p-8 shadow-2xl border-8 border-ps2black relative overflow-hidden">
            <!-- Controller Body Details -->
            <div class="absolute top-0 left-0 w-full h-4 bg-ps2black opacity-30"></div>
            <div class="absolute bottom-0 left-0 w-full h-4 bg-ps2black opacity-30"></div>
            
            <!-- Controller Layout -->
            <div class="flex flex-col md:flex-row gap-12 items-center">
                <!-- Left Side: D-pad and Left Analog -->
                <div class="flex flex-col items-center gap-1 w-full md:w-1/3">
                    <!-- D-pad -->
                    <div class="d-pad">
                        <div id="up" class="d-pad-button w-10 h-16 top-0 left-1/2 transform -translate-x-1/2">
                            <span class="text-white font-bold text-2xl tracking-wider">↑</span>
                        </div>
                        <div id="down" class="d-pad-button w-10 h-16 bottom-0 left-1/2 transform -translate-x-1/2">
                            <span class="text-white font-bold text-2xl tracking-wider">↓</span>
                        </div>
                        <div id="left" class="d-pad-button w-16 h-10 top-1/2 left-0 transform -translate-y-1/2">
                            <span class="text-white font-bold text-2xl tracking-wider">←</span>
                        </div>
                        <div id="right" class="d-pad-button w-16 h-10 top-1/2 right-0 transform -translate-y-1/2">
                            <span class="text-white font-bold text-2xl tracking-wider">→</span>
                        </div>
                        <div class="absolute w-16 h-16 bg-ps2black rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10"></div>
                    </div>
                    
                    <!-- Left Analog Stick -->
                    <div class="flex flex-col items-center">
                        <span class="text-ps2black font-bold mb-2">L3</span>
                        <div id="left-analog" class="analog-stick">
                            <div id="left-analog-dot" class="analog-dot"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Middle: Start, Select, Logo, Camera -->
                <div class="flex flex-col items-center gap-3 w-full md:w-1/3">
                    <!-- 顶部：SELECT + LOGO + START 竖排 -->
                    <div class="flex items-center gap-6">
                        <!-- 左侧：SELECT 竖放 -->
                        <div class="vertical-button items-center">
                            <div id="select" class="w-4 h-10 bg-ps2black rounded-full flex items-center justify-center transition-all duration-100 active:scale-90">
                                <span class="text-white">⏹</span>
                            </div>
                        </div>

                        <!-- 中间：LOGO -->
                        <div class="w-48 h-12 bg-ps2black rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-2xl tracking-wider">RUSH-MOG</span>
                        </div>

                        <!-- 右侧：START 竖放 -->
                        <div class="vertical-button items-center">
                            <div id="start" class="w-4 h-10 bg-ps2black rounded-full flex items-center justify-center transition-all duration-100 active:scale-90">
                                <span class="text-white">▶</span>
                            </div>
                        </div>
                    </div>

                    <!-- 摄像头画面 320×240  src="https://picsum.photos/320/240"  -->
                    <div class="mt-2 border-4 border-ps2black rounded-lg bg-black overflow-hidden">
                        <img 
                            id="camera" 
                            src="unimog.jpeg" 
                            alt="Camera" 
                            width="320" 
                            height="240"
                            class="object-cover"
                        />
                    </div>
                </div>
                
                <!-- Right Side: Action Buttons and Right Analog -->
                <div class="flex flex-col items-center gap-6 w-full md:w-1/3">
                    <!-- Action Buttons -->
                    <div class="relative w-36 h-36">
                        <div id="triangle" class="action-button bg-ps2blue absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/4">
                            △
                        </div>
                        <div id="circle" class="action-button bg-ps2red absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1/4">
                            ○
                        </div>
                        <div id="cross" class="action-button bg-ps2green absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/4">
                            ×
                        </div>
                        <div id="square" class="action-button bg-ps2yellow absolute left-0 top-1/2 transform -translate-y-1/2 -translate-x-1/4">
                            □
                        </div>
                    </div>
                    
                    <!-- Right Analog Stick -->
                    <div class="flex flex-col items-center">
                        <span class="text-ps2black font-bold mb-1">R3</span>
                        <div id="right-analog" class="analog-stick">
                            <div id="right-analog-dot" class="analog-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 🔥 固定宽度底部：永远不伸缩、不抖动 -->
            <div class="mt-4 flex items-stretch" style="width: 768px; gap: 4px;">
                <!-- 左侧 L1 / L2 固定宽度 -->
                <div class="flex flex-col h-[88px] w-[64px]">
                    <div id="l1" class="h-1/2 bg-ps2black rounded-md flex items-center justify-center text-white font-bold transition-all duration-100 active:scale-95">L1</div>
                    <div id="l2" class="h-1/2 bg-ps2dark rounded-md flex items-center justify-center text-white font-bold mt-0.5 transition-all duration-100 active:scale-95">L2</div>
                </div>

                <!-- 中间：状态栏 固定宽度 -->
                <div id="status" class="bg-ps2black text-white p-3 rounded-md h-[88px] w-[584px] grid grid-cols-1 md:grid-cols-4 gap-1 overflow-hidden">
                    <div class="bg-gray-800 p-2 rounded">No input detected</div>
                </div>

                <!-- 右侧 R1 / R2 固定宽度 -->
                <div class="flex flex-col h-[88px] w-[64px]">
                    <div id="r1" class="h-1/2 bg-ps2black rounded-md flex items-center justify-center text-white font-bold transition-all duration-100 active:scale-95">R1</div>
                    <div id="r2" class="h-1/2 bg-ps2dark rounded-md flex items-center justify-center text-white font-bold mt-0.5 transition-all duration-100 active:scale-95">R2</div>
                </div>
            </div>
        </div>

    <script>
        // Track button presses and update status
        const statusElement = document.getElementById('status');
        const maxStatusEntries = 4;
        let statusEntries = [];
        
        function updateStatus(button) {
            statusEntries.unshift(`${button}`);
            if (statusEntries.length > maxStatusEntries) {
                statusEntries = statusEntries.slice(0, maxStatusEntries);
            }
            statusElement.innerHTML = '';
            statusEntries.forEach(entry => {
                const el = document.createElement('div');
                el.className = 'bg-gray-800 p-2 rounded';
                el.textContent = entry;
                statusElement.appendChild(el);
            });
        }
        
        // Handle all buttons
        const buttons = ['up','down','left','right','triangle','circle','cross','square','select','start','l1','r1','l2','r2'];
        buttons.forEach(buttonId => {
            const btn = document.getElementById(buttonId);
            if(!btn) return;
            
            btn.addEventListener('mousedown', () => {
                btn.classList.add('button-press');
                updateStatus(buttonId.toUpperCase()+"-down");
                fetch(`/cmd-button?key=${buttonId}&type=down`);
            });
            btn.addEventListener('mouseup', () => {
                btn.classList.remove('button-press');
                updateStatus(buttonId.toUpperCase()+"-up");
                fetch(`/cmd-button?key=${buttonId}&type=up`);
            });
            btn.addEventListener('mouseleave', () => btn.classList.remove('button-press'));
            
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                btn.classList.add('button-press');
                updateStatus(buttonId.toUpperCase()+"-down");
                fetch(`/cmd-button?key=${buttonId}&type=down`);
            });
            btn.addEventListener('touchend', e => {
                e.preventDefault();
                btn.classList.remove('button-press');
                updateStatus(buttonId.toUpperCase()+"-up");
                fetch(`/cmd-button?key=${buttonId}&type=up`);
            });
        });
        
        // Analog Sticks
        function setupAnalogStick(stickId, dotId) {
            const stick = document.getElementById(stickId);
            const dot = document.getElementById(dotId);
            let isDragging = false;
            const stickRect = stick.getBoundingClientRect();
            const centerX = stickRect.width/2, centerY = stickRect.height/2;
            const maxDist = centerX - 10;
            let throttle = false;
            
            stick.addEventListener('mousedown', start);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', end);
            
            dot.addEventListener('touchstart', e => {e.preventDefault(); start(getTouch(e));});
            document.addEventListener('touchmove', e => {e.preventDefault(); drag(getTouch(e));});
            document.addEventListener('touchend', e => {e.preventDefault(); end();});
            
            function getTouch(e) {const t=e.touches[0]; return {clientX:t.clientX, clientY:t.clientY};}
            function start(e) {isDragging=true; drag(e);}
            function end() {if(!isDragging) return; isDragging=false; dot.style.transform='translate(-50%,-50%)'; updateStatus(stickId.split('-')[0].toUpperCase()+'3 (stop, 0)'); fetch(`/cmd-stick?stickId=${stickId}&direct=stop&stepValue=0`);}
            
            function drag(e) {
                if(!isDragging || throttle) return;
                throttle=true; setTimeout(()=>throttle=false, 200);
                
                const rect = stick.getBoundingClientRect();
                const x = e.clientX - (rect.left+centerX);
                const y = e.clientY - (rect.top+centerY);
                const dist = Math.hypot(x,y);
                const fx = dist>maxDist ? x/dist*maxDist : x;
                const fy = dist>maxDist ? y/dist*maxDist : y;
                dot.style.transform = `translate(-50%,-50%) translate(${fx}px,${fy}px)`;
                
                const nx = (fx/maxDist).toFixed(2);
                const ny = (fy/maxDist).toFixed(2);
                const dir = getDir(nx,ny);
                updateStatus(`${stickId.split('-')[0].toUpperCase()}3 (${dir.direct}, ${dir.stepValue})`);
                fetch(`/cmd-stick?stickId=${stickId}&direct=${dir.direct}&stepValue=${dir.stepValue}`);
            }
            
            function getDir(x,y) {
                x=parseFloat(x); y=parseFloat(y);
                let tan = Math.abs(y/x) || 99;
                let d;
                if(tan>2.414) d=y<0?'up':'down';
                else if(tan<0.414) d=x<0?'left':'right';
                else {
                    if(x<0&&y<0)d='uple';
                    else if(x>0&&y<0)d='uprt';
                    else if(x<0&&y>0)d='dnle';
                    else d='dnrt';
                }
                return {direct:d, stepValue: Math.round(Math.hypot(x,y)*5)};
            }
        }
        
        setupAnalogStick('left-analog','left-analog-dot');
        setupAnalogStick('right-analog','right-analog-dot');
    </script>
</body>
</html>
