<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSH-MOG</title>
    <script src="ps2.js"></script>
    <link href="ps2.css" rel="stylesheet">
    <!-- TensorFlow.js 和 COCO-SSD 模型 -->
    <script src="tf.min.js"></script>
    <script src="coco-ssd.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ps2gray: '#C0C0C0',
                        ps2dark: '#333333',
                        ps2red: '#D22B2B',
                        ps2green: '#32CD32',
                        ps2blue: '#1E90FF',
                        ps2yellow: '#FFD700',
                        ps2black: '#1A1A1A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .d-pad {
                @apply relative w-32 h-32 md:w-40 md:h-40 mx-auto;
            }
            .d-pad-button {
                @apply absolute bg-ps2black rounded-md flex items-center justify-center transition-all duration-100 active:scale-90;
            }
            .button-press {
                @apply scale-90 shadow-inner;
            }
            .analog-stick {
                @apply w-16 h-16 md:w-20 md:h-20 rounded-full bg-ps2dark border-4 border-gray-700 relative mx-auto transition-all duration-100;
            }
            .analog-dot {
                @apply absolute w-8 h-8 md:w-10 md:h-10 bg-ps2black rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-100;
            }
            .action-button {
                @apply w-10 h-10 md:w-14 md:h-14 rounded-full flex items-center justify-center text-white font-bold text-sm md:text-lg transition-all duration-100 active:scale-90 shadow-lg;
            }
            .vertical-button {
                @apply flex flex-col items-center gap-1;
            }
            * {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 md:p-4" onselectstart="return false">
    <!-- 容器改为自适应最大宽度，手机横屏自动缩放到合适大小 -->
    <!-- <div class="w-full max-w-[720px] md:max-w-4xl mx-auto">
         <div class="bg-ps2gray rounded-2xl md:rounded-3xl p-4 md:p-8 shadow-2xl border-4 md:border-8 border-ps2black relative overflow-hidden"> -->

        <!-- Controller Container -->

                <div class="flex flex-col items-center gap-1 w-full md:w-1/3">
                    <!-- D-pad -->
                    <div class="d-pad">

                        </div>

                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">↓</span>
                        </div>
                        <div id="left" class="d-pad-button w-12 h-8 md:w-16 md:h-10 top-1/2 left-0 transform -translate-y-1/2">
                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">←</span>
                        </div>
                        <div id="right" class="d-pad-button w-12 h-8 md:w-16 md:h-10 top-1/2 right-0 transform -translate-y-1/2">
                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">→</span>

                        <div class="absolute w-12 h-12 md:w-16 md:h-16 bg-ps2black rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10"></div>

                            <div id="left-analog-dot" class="analog-dot"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Middle: Start, Select, Logo, Camera -->
                <div class="flex flex-col items-center gap-2 md:gap-6 w-3/4">
                    <!-- 顶部：SELECT + LOGO + START 竖排 -->
                    <div class="flex items-center gap-2 md:gap-4">
                        <!-- 左侧：SELECT 竖放 -->
                        <div class="vertical-button items-center">
                            <div id="select" class="w-6 h-8 md:w-6 md:h-10 bg-ps2black rounded-full flex items-center justify-center transition-all duration-100 active:scale-90">
                                <span class="text-white text-sm">⏹</span>
                            </div>
                        </div>

                        <!-- 中间：LOGO -->
                        <div class="w-40 h-8 md:w-60 md:h-12 bg-ps2black rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-base md:text-2xl tracking-wider">RUSH-MOG</span>
                        </div>

                        <!-- 右侧：START 竖放 -->
                        <div class="vertical-button items-center">
                            <div id="start" class="w-6 h-8 md:w-6 md:h-10 bg-ps2black rounded-full flex items-center justify-center transition-all duration-100 active:scale-90">
                                <span class="text-white text-sm">▶</span>
                            </div>
                        </div>
                    </div>

                    <!-- 摄像头画面 自适应缩小 -->
                    <div class="mt-2 border-2 md:border-4 border-ps2black rounded-lg bg-black overflow-hidden relative" style="max-width: 320px; max-height: 205px;">
                        <img 
                            id="camera" 
                            src="unimog.jpeg" 
                            alt="Camera Stream" 
                            width="320" 
                            height="205"
                            class="object-cover"
                            style="max-width: 320px; max-height: 205px; width: auto; height: auto;"
                        />
                        <!-- YOLO检测Canvas覆盖层 -->
                        <canvas 
                            id="detection-canvas" 
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"
                            width="320" 
                            height="205"
                        ></canvas>
                        <!-- 摄像头状态指示器 -->
                        <div id="camera-status" class="absolute top-1 right-1 flex items-center gap-1 bg-black bg-opacity-50 px-2 py-0.5 rounded text-xs text-white">
                            <span id="camera-status-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
                            <span id="camera-status-text">Click here to start</span>
                        </div>
                        <!-- YOLO状态指示器 -->
                        <div id="yolo-status" class="absolute bottom-1 left-1 flex items-center gap-1 bg-black bg-opacity-50 px-2 py-0.5 rounded text-xs text-white">
                            <span id="yolo-status-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
                            <span id="yolo-status-text">YOLO Off</span>
                        </div>
                    </div>
                </div>
                
                <!-- Right Side: Action Buttons and Right Analog -->
                <div class="flex flex-col items-center gap-3 md:gap-6 w-1/3">
                    <!-- Action Buttons -->
                    <div class="relative w-28 h-28 md:w-36 md:h-36">
                        <div id="triangle" class="action-button bg-ps2blue absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/4">
                            △
                        </div>
                        <div id="circle" class="action-button bg-ps2red absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1/4">
                            ○
                        </div>
                        <div id="cross" class="action-button bg-ps2green absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/4">
                            ×
                        </div>
                        <div id="square" class="action-button bg-ps2yellow absolute left-0 top-1/2 transform -translate-y-1/2 -translate-x-1/4">
                            □
                        </div>
                    </div>
                    
                    <!-- Right Analog Stick -->
                    <div class="flex flex-col items-center">
                        <span class="text-ps2black font-bold mb-1 text-sm">R3</span>
                        <div id="right-analog" class="analog-stick">
                            <div id="right-analog-dot" class="analog-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 底部：自适应宽度、不再写死像素，Mate60横屏完美适配不溢出 -->
            <div class="mt-3 md:mt-4 flex items-stretch w-full gap-2">
                <!-- 左侧 L1 / L2 自适应固定窄宽 -->
                <div class="flex flex-col h-[60px] md:h-[60px] w-12 md:w-16 shrink-0">
                    <div id="l1" class="h-1/2 bg-ps2black rounded-md flex items-center justify-center text-white font-bold text-sm transition-all duration-100 active:scale-95">L1</div>
                    <div id="l2" class="h-1/2 bg-ps2dark rounded-md flex items-center justify-center text-white font-bold text-sm mt-0.5 transition-all duration-100 active:scale-95">L2</div>
                </div>

                <!-- 中间：状态栏弹性宽度、固定高度、内容溢出隐藏，不会撑宽页面 -->
                <div id="status" class="bg-ps2black text-white p-2 md:p-3 rounded-md h-[60px] md:h-[60px] flex-1 grid grid-cols-1 md:grid-cols-4 gap-1 overflow-hidden">
                    <div class="bg-gray-600 p-1 md:p-1 rounded text-xs md:text-sm">No input detected</div>
                </div>

                <!-- YOLO开关按钮 -->
                <div class="flex flex-col h-[60px] md:h-[60px] w-14 md:w-16 shrink-0">
                    <div id="yolo-btn" class="h-full bg-ps2green rounded-md flex items-center justify-center text-white font-bold text-xs md:text-sm transition-all duration-100 active:scale-95 cursor-pointer" title="Toggle YOLO Detection">
                        🎯
                    </div>
                </div>

                <!-- 语音识别按钮 -->
                <div class="flex flex-col h-[60px] md:h-[60px] w-14 md:w-16 shrink-0">
                    <div id="voice-btn" class="h-full bg-ps2blue rounded-md flex items-center justify-center text-white font-bold text-xs md:text-sm transition-all duration-100 active:scale-95 cursor-pointer" title="Voice Control">
                        🎙️
                    </div>
                </div>

                <!-- 音频按钮 -->
                <div class="flex flex-col h-[60px] md:h-[60px] w-14 md:w-16 shrink-0">
                    <div id="audio-btn" class="h-full bg-ps2red rounded-md flex items-center justify-center text-white font-bold text-xs md:text-sm transition-all duration-100 active:scale-95 cursor-pointer">
                        🎤
                    </div>
                </div>

                <!-- 右侧 R1 / R2 同左侧固定窄宽 -->
                <div class="flex flex-col h-[60px] md:h-[60px] w-12 md:w-16 shrink-0">
                    <div id="r1" class="h-1/2 bg-ps2black rounded-md flex items-center justify-center text-white font-bold text-sm transition-all duration-100 active:scale-95">R1</div>
                    <div id="r2" class="h-1/2 bg-ps2dark rounded-md flex items-center justify-center text-white font-bold text-sm mt-0.5 transition-all duration-100 active:scale-95">R2</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Track button presses and update status
        const statusElement = document.getElementById('status');
        const maxStatusEntries = 4;
        let statusEntries = [];
        
        function updateStatus(button) {
            statusEntries.unshift(`${button}`);
            if (statusEntries.length > maxStatusEntries) {
                statusEntries = statusEntries.slice(0, maxStatusEntries);
            }
            statusElement.innerHTML = '';
            statusEntries.forEach(entry => {
                const el = document.createElement('div');
                el.className = 'bg-gray-800 p-1 md:p-1 rounded text-xs md:text-sm';
                el.textContent = entry;
                statusElement.appendChild(el);
            });
        }
        
        // Handle all buttons
        const buttons = ['up','down','left','right','triangle','circle','cross','square','select','start','l1','r1','l2','r2'];
        buttons.forEach(buttonId => {
            const btn = document.getElementById(buttonId);
            if(!btn) return;
            
            btn.addEventListener('mousedown', () => {
                btn.classList.add('button-press');
                updateStatus(buttonId.toUpperCase()+"-down");
                fetch(`/cmd-button?key=${buttonId}&type=down`);
            });
            btn.addEventListener('mouseup', () => {
                btn.classList.remove('button-press');
                updateStatus(buttonId.toUpperCase()+"-up");
                fetch(`/cmd-button?key=${buttonId}&type=up`);
            });
            btn.addEventListener('mouseleave', () => btn.classList.remove('button-press'));
            
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                btn.classList.add('button-press');
                updateStatus(buttonId.toUpperCase()+"-down");
                fetch(`/cmd-button?key=${buttonId}&type=down`);
            });
            btn.addEventListener('touchend', e => {
                e.preventDefault();
                btn.classList.remove('button-press');
                updateStatus(buttonId.toUpperCase()+"-up");
                fetch(`/cmd-button?key=${buttonId}&type=up`);
            });
        });
        
        // Analog Sticks
        function setupAnalogStick(stickId, dotId) {
            const stick = document.getElementById(stickId);
            const dot = document.getElementById(dotId);
            let isDragging = false;
            const stickRect = stick.getBoundingClientRect();
            const centerX = stickRect.width/2, centerY = stickRect.height/2;
            const maxDist = centerX - 10;
            let throttle = false;
            
            stick.addEventListener('mousedown', start);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', end);
            
            dot.addEventListener('touchstart', e => {e.preventDefault(); start(getTouch(e));});
            document.addEventListener('touchmove', e => {e.preventDefault(); drag(getTouch(e));});
            document.addEventListener('touchend', e => {e.preventDefault(); end();});
            
            function getTouch(e) {const t=e.touches[0]; return {clientX:t.clientX, clientY:t.clientY};}
            function start(e) {isDragging=true; drag(e);}
            function end() {if(!isDragging) return; isDragging=false; dot.style.transform='translate(-50%,-50%)'; updateStatus(stickId.split('-')[0].toUpperCase()+'3 (stop, 0)'); fetch(`/cmd-stick?stickId=${stickId}&direct=stop&stepValue=0`);}
            
            function drag(e) {
                if(!isDragging || throttle) return;
                throttle=true; setTimeout(()=>throttle=false, 200);
                
                const rect = stick.getBoundingClientRect();
                const x = e.clientX - (rect.left+centerX);
                const y = e.clientY - (rect.top+centerY);
                const dist = Math.hypot(x,y);
                const fx = dist>maxDist ? x/dist*maxDist : x;
                const fy = dist>maxDist ? y/dist*maxDist : y;
                dot.style.transform = `translate(-50%,-50%) translate(${fx}px,${fy}px)`;
                
                const nx = (fx/maxDist).toFixed(2);
                const ny = (fy/maxDist).toFixed(2);
                const dir = getDir(nx,ny);
                updateStatus(`${stickId.split('-')[0].toUpperCase()}3 (${dir.direct}, ${dir.stepValue})`);
                fetch(`/cmd-stick?stickId=${stickId}&direct=${dir.direct}&stepValue=${dir.stepValue}`);
            }
            
            function getDir(x,y) {
                x=parseFloat(x); y=parseFloat(y);
                let tan = Math.abs(y/x) || 99;
                let d;
                if(tan>2.414) d=y<0?'up':'down';
                else if(tan<0.414) d=x<0?'left':'right';
                else {
                    if(x<0&&y<0)d='uple';
                    else if(x>0&&y<0)d='uprt';
                    else if(x<0&&y>0)d='dnle';
                    else d='dnrt';
                }
                return {direct:d, stepValue: Math.round(Math.hypot(x,y)*5)};
            }
        }
        
        setupAnalogStick('left-analog','left-analog-dot');
        setupAnalogStick('right-analog','right-analog-dot');

        // ==================== 摄像头流管理（修复版） ====================
        const cameraImg = document.getElementById('camera');
        const statusDot = document.getElementById('camera-status-dot');
        const statusText = document.getElementById('camera-status-text');
        const defaultImage = 'unimog.jpeg';
        const streamUrl = '/stream';
        let isStreaming = false;
        let retryCount = 0;
        const maxRetries = 3;
        let isStopping = false; // 新增：防止关闭时触发错误重连

        // 启动摄像头流
        function startCameraStream() {
            if (isStreaming) return;
            
            isStopping = false;
            isStreaming = true;
            
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500';
            statusText.textContent = 'Connecting...';
            
            // 加载流
            cameraImg.src = streamUrl + '?t=' + Date.now();
        }

        // 停止摄像头流
        function stopCameraStream() {
            if (!isStreaming) return;
            
            isStopping = true;     // 标记正在手动关闭
            isStreaming = false;
            retryCount = 0;
            
            // 中断流
            cameraImg.src = '';
            cameraImg.src = defaultImage;
            
            statusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
            statusText.textContent = 'Click here to start';
        }

        // 图片加载错误处理（修复版）
        cameraImg.onerror = function () {
            // 如果是手动关闭，不处理错误
            if (isStopping) {
                isStopping = false;
                return;
            }

            if (isStreaming) {
                // 流真的断开了
                isStreaming = false;
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                statusText.textContent = 'Stream error';

                // 自动重试
                retryCount++;
                if (retryCount < maxRetries) {
                    setTimeout(() => {
                        if (isStopping) return;
                        startCameraStream();
                    }, 2000);
                } else {
                    isStopping = true;
                    cameraImg.src = '';
                    cameraImg.src = defaultImage;
                    
                    statusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
                    statusText.textContent = 'Click here to start';
                }
            }
        };

        // 图片加载成功
        cameraImg.onload = function () {
            if (isStreaming && !isStopping) {
                statusDot.className = 'w-2 h-2 rounded-full bg-green-500';
                statusText.textContent = 'Live';
            }
            retryCount = 0;
        };

        // Logo 点击切换（修复版）
        const logoElement = document.getElementById('camera');
        logoElement.style.cursor = 'pointer';
        logoElement.addEventListener('click', function () {
            if (isStreaming) {
                stopCameraStream();  // 关闭
            } else {
                startCameraStream(); // 打开
            }
        });
        logoElement.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            logoElement.classList.add('button-press');
            if (isStreaming) {
                stopCameraStream();  // 关闭
            } else {
                startCameraStream(); // 打开
            }
        });
        
        logoElement.addEventListener('touchend', (e) => {
            e.preventDefault();
            logoElement.classList.remove('button-press');
        });

        // ==================== 音频录制功能 ====================
        const audioBtn = document.getElementById('audio-btn');
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // 检查麦克风权限支持
        function checkMicSupport() {
            // 优先使用 mediaDevices.getUserMedia
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                return 'modern';
            }
            // 回退到旧的 getUserMedia API
            if (navigator.getUserMedia) {
                return 'legacy';
            }
            if (navigator.webkitGetUserMedia) {
                return 'webkit';
            }
            if (navigator.mozGetUserMedia) {
                return 'moz';
            }
            return 'none';
        }

        // 初始化音频录制
        async function initAudio() {
            const support = checkMicSupport();
            
            if (support === 'none') {
                console.error('浏览器不支持麦克风访问');
                updateStatus('MIC NOT SUPPORTED');
                // 提示用户
                alert('您的浏览器不支持麦克风功能。\n\n请使用 Chrome/Firefox/Edge 浏览器，\n并通过 HTTPS 或 localhost 访问此页面。\n\n当前通过 HTTP 访问可能无法使用麦克风。');
                return false;
            }
            
            try {
                let stream;
                
                if (support === 'modern') {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true
                        } 
                    });
                } else {
                    // 旧的 API 使用回调方式
                    const getUserMedia = navigator.getUserMedia || 
                                        navigator.webkitGetUserMedia || 
                                        navigator.mozGetUserMedia;
                    
                    return new Promise((resolve, reject) => {
                        getUserMedia.call(navigator, { audio: true }, 
                            (s) => {
                                stream = s;
                                mediaRecorder = new MediaRecorder(stream);
                                
                                mediaRecorder.ondataavailable = (e) => {
                                    if (e.data.size > 0) {
                                        audioChunks.push(e.data);
                                    }
                                };
                                
                                mediaRecorder.onstop = async () => {
                                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                                    audioChunks = [];
                                    await sendAudioToESP32(audioBlob);
                                };
                                
                                resolve(true);
                            },
                            (err) => {
                                console.error('无法访问麦克风:', err);
                                updateStatus('MIC ERROR');
                                resolve(false);
                            }
                        );
                    });
                }
                
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    // 发送音频到 ESP32
                    await sendAudioToESP32(audioBlob);
                };
                
                return true;
            } catch (err) {
                console.error('无法访问麦克风:', err);
                updateStatus('MIC ERROR');
                
                // 如果是安全上下文问题，给出提示
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    alert('麦克风权限被拒绝。请在浏览器设置中允许麦克风访问。');
                } else if (location.protocol === 'http:' && location.hostname !== 'localhost') {
                    alert('麦克风功能需要安全上下文（HTTPS）。\n\n当前通过 HTTP 访问可能无法使用麦克风。\n\n建议：\n1. 使用 Chrome 浏览器\n2. 在地址栏输入 chrome://flags/#unsafely-treat-insecure-origin-as-secure\n3. 启用 "Insecure origins treated as secure" 并添加 ESP32 的 IP 地址');
                }
                
                return false;
            }
        }

        // 发送音频到 ESP32
        async function sendAudioToESP32(audioBlob) {
            updateStatus('SENDING AUDIO...');
            audioBtn.style.backgroundColor = '#FF6B6B';
            
            try {
                // 将 Blob 转换为 ArrayBuffer
                const arrayBuffer = await audioBlob.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                
                // 使用 FormData 发送音频
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                const response = await fetch('/audio', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.text();
                    updateStatus('🎤 ' + result);
                } else {
                    updateStatus('SEND FAILED');
                }
            } catch (err) {
                console.error('发送音频失败:', err);
                updateStatus('SEND ERROR');
            }
            
            audioBtn.style.backgroundColor = '';
        }

        // 音频按钮事件处理
        audioBtn.addEventListener('mousedown', async () => {
            audioBtn.classList.add('button-press');
            
            if (!mediaRecorder) {
                const initialized = await initAudio();
                if (!initialized) return;
            }
            
            if (mediaRecorder && mediaRecorder.state === 'inactive') {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                updateStatus('🎤 RECORDING...');
                audioBtn.style.backgroundColor = '#FF4444';
            }
        });

        audioBtn.addEventListener('mouseup', () => {
            audioBtn.classList.remove('button-press');
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                audioBtn.style.backgroundColor = '';
            }
        });

        audioBtn.addEventListener('mouseleave', () => {
            if (isRecording) {
                audioBtn.classList.remove('button-press');
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    isRecording = false;
                    audioBtn.style.backgroundColor = '';
                }
            }
        });

        // 触摸事件
        audioBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            audioBtn.classList.add('button-press');
            
            if (!mediaRecorder) {
                const initialized = await initAudio();
                if (!initialized) return;
            }
            
            if (mediaRecorder && mediaRecorder.state === 'inactive') {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                updateStatus('🎤 RECORDING...');
                audioBtn.style.backgroundColor = '#FF4444';
            }
        });

        audioBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            audioBtn.classList.remove('button-press');
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                audioBtn.style.backgroundColor = '';
            }
        });

        // ==================== YOLO 物体识别功能 ====================
        const yoloBtn = document.getElementById('yolo-btn');
        const detectionCanvas = document.getElementById('detection-canvas');
        const yoloStatusDot = document.getElementById('yolo-status-dot');
        const yoloStatusText = document.getElementById('yolo-status-text');
        const ctx = detectionCanvas.getContext('2d');
        
        let yoloEnabled = false;
        let yoloModel = null;
        let yoloDetectionInterval = null;
        let yoloLoading = false;

        // 颜色映射表（为不同类别分配不同颜色）
        const colorMap = {};
        const baseColors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
            '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
            '#F1948A', '#82E0AA', '#F8C471', '#AED6F1', '#A3E4D7'
        ];

        function getColorForClass(className) {
            if (!colorMap[className]) {
                const index = Object.keys(colorMap).length % baseColors.length;
                colorMap[className] = baseColors[index];
            }
            return colorMap[className];
        }

        // 加载YOLO模型（使用COCO-SSD）
        // 注意：COCO-SSD模型需要从外部服务器下载模型权重文件
        // 默认使用Google服务器，如果无法访问，可以配置使用其他镜像源
        async function loadYoloModel() {
            if (yoloModel) return yoloModel;
            
            yoloLoading = true;
            yoloStatusDot.className = 'w-2 h-2 rounded-full bg-yellow-500 animate-pulse';
            yoloStatusText.textContent = 'Loading model...';
            
            try {
                // 尝试从默认源加载模型
                // 如果失败，可以尝试使用modelUrl参数指定其他源
                // 例如: cocoSsd.load({ modelUrl: 'https://your-server.com/models/ssd_lite_mobilenet_v2' })
                yoloModel = await cocoSsd.load();
                console.log('YOLO/COCO-SSD model loaded successfully');
                
                yoloStatusDot.className = 'w-2 h-2 rounded-full bg-green-500';
                yoloStatusText.textContent = 'YOLO Ready';
                yoloLoading = false;
                
                return yoloModel;
            } catch (error) {
                console.error('Failed to load YOLO model:', error);
                yoloStatusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                yoloStatusText.textContent = 'Model load failed - check network';
                yoloLoading = false;
                
                // 显示详细的错误信息和解决方案
                alert(
                    'YOLO模型加载失败！\n\n' +
                    '原因：COCO-SSD模型需要从外部服务器下载权重文件（约5MB）\n\n' +
                    '解决方案：\n' +
                    '1. 首次使用时，请在有网络的环境下打开页面，模型会被浏览器缓存\n' +
                    '2. 或者将模型文件部署到本地服务器\n' +
                    '3. 修改代码中的modelUrl指向您的模型服务器\n\n' +
                    '错误详情：' + error.message
                );
                
                return null;
            }
        }

        // 执行物体检测
        async function performDetection() {
            if (!yoloEnabled || !yoloModel || !isStreaming) return;
            
            try {
                // 检测物体
                const predictions = await yoloModel.detect(cameraImg);
                
                // 清除Canvas
                ctx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
                
                // 获取实际显示尺寸与Canvas尺寸的缩放比例
                const displayWidth = cameraImg.clientWidth;
                const displayHeight = cameraImg.clientHeight;
                const scaleX = detectionCanvas.width / displayWidth;
                const scaleY = detectionCanvas.height / displayHeight;
                
                // 绘制每个检测结果
                predictions.forEach(prediction => {
                    const [x, y, width, height] = prediction.bbox;
                    const color = getColorForClass(prediction.class);
                    
                    // 缩放坐标到Canvas尺寸
                    const canvasX = x * scaleX;
                    const canvasY = y * scaleY;
                    const canvasW = width * scaleX;
                    const canvasH = height * scaleY;
                    
                    // 绘制检测框
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(canvasX, canvasY, canvasW, canvasH);
                    
                    // 绘制标签背景
                    const label = `${prediction.class} ${Math.round(prediction.score * 100)}%`;
                    ctx.font = 'bold 10px Arial';
                    const textWidth = ctx.measureText(label).width;
                    const labelHeight = 16;
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(canvasX, canvasY - labelHeight, textWidth + 8, labelHeight);
                    
                    // 绘制标签文字
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(label, canvasX + 4, canvasY - 4);
                });
                
                // 更新状态
                if (predictions.length > 0) {
                    const classNames = [...new Set(predictions.map(p => p.class))];
                    yoloStatusText.textContent = `${predictions.length} objects: ${classNames.slice(0, 3).join(', ')}`;
                } else {
                    yoloStatusText.textContent = 'No objects detected';
                }
                
            } catch (error) {
                console.error('Detection error:', error);
            }
        }

        // 切换YOLO开关
        async function toggleYolo() {
            if (yoloLoading) return;
            
            if (!yoloEnabled) {
                // 开启YOLO
                if (!yoloModel) {
                    const model = await loadYoloModel();
                    if (!model) return;
                }
                
                yoloEnabled = true;
                yoloBtn.style.backgroundColor = '#FF6B6B'; // 红色表示开启
                yoloStatusDot.className = 'w-2 h-2 rounded-full bg-green-500 animate-pulse';
                yoloStatusText.textContent = 'YOLO On';
                
                // 开始定时检测（每500ms一次）
                yoloDetectionInterval = setInterval(performDetection, 500);
                
                updateStatus('🎯 YOLO ON');
                console.log('YOLO detection enabled');
            } else {
                // 关闭YOLO
                yoloEnabled = false;
                yoloBtn.style.backgroundColor = ''; // 恢复绿色
                yoloStatusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
                yoloStatusText.textContent = 'YOLO Off';
                
                // 停止定时检测
                if (yoloDetectionInterval) {
                    clearInterval(yoloDetectionInterval);
                    yoloDetectionInterval = null;
                }
                
                // 清除Canvas
                ctx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
                
                updateStatus('🎯 YOLO OFF');
                console.log('YOLO detection disabled');
            }
        }

        // YOLO按钮事件
        yoloBtn.addEventListener('mousedown', () => {
            yoloBtn.classList.add('button-press');
            toggleYolo();
        });
        yoloBtn.addEventListener('mouseup', () => {
            yoloBtn.classList.remove('button-press');
        });
        yoloBtn.addEventListener('mouseleave', () => {
            yoloBtn.classList.remove('button-press');
        });

        // 触摸事件
        yoloBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            yoloBtn.classList.add('button-press');
            toggleYolo();
        });
        yoloBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            yoloBtn.classList.remove('button-press');
        });

        // 当摄像头流停止时，也停止YOLO检测
        const originalStopCamera = stopCameraStream;
        stopCameraStream = function() {
            originalStopCamera();
            if (yoloEnabled) {
                yoloEnabled = false;
                yoloBtn.style.backgroundColor = '';
                yoloStatusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
                yoloStatusText.textContent = 'YOLO Off';
                if (yoloDetectionInterval) {
                    clearInterval(yoloDetectionInterval);
                    yoloDetectionInterval = null;
                }
                ctx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
            }
        };

        // ==================== 语音识别控制功能 ====================
        const voiceBtn = document.getElementById('voice-btn');
        let recognition = null;
        let voiceEnabled = false;

        // 语音命令映射表（支持中英文）
        const voiceCommands = {
            // 方向命令
            '前进': { key: 'up', type: 'down' },
            'forward': { key: 'up', type: 'down' },
            'go': { key: 'up', type: 'down' },
            '后退': { key: 'down', type: 'down' },
            'backward': { key: 'down', type: 'down' },
            'back': { key: 'down', type: 'down' },
            '向左': { key: 'left', type: 'down' },
            'left': { key: 'left', type: 'down' },
            '向右': { key: 'right', type: 'down' },
            'right': { key: 'right', type: 'down' },
            
            // 停止命令
            '停止': { key: 'stop', type: 'stop' },
            'stop': { key: 'stop', type: 'stop' },
            '停': { key: 'stop', type: 'stop' },
            
            // 动作按钮
            '三角': { key: 'triangle', type: 'press' },
            'triangle': { key: 'triangle', type: 'press' },
            '方块': { key: 'square', type: 'press' },
            'square': { key: 'square', type: 'press' },
            '圆形': { key: 'circle', type: 'press' },
            'circle': { key: 'circle', type: 'press' },
            '叉': { key: 'cross', type: 'press' },
            'cross': { key: 'cross', type: 'press' },
            'x': { key: 'cross', type: 'press' },
            
            // 肩键
            'L1': { key: 'l1', type: 'press' },
            'R1': { key: 'r1', type: 'press' },
            'L2': { key: 'l2', type: 'press' },
            'R2': { key: 'r2', type: 'press' },
            
            // 功能键
            '开始': { key: 'start', type: 'press' },
            'start': { key: 'start', type: 'press' },
            '选择': { key: 'select', type: 'press' },
            'select': { key: 'select', type: 'press' },
        };

        // 执行语音命令
        function executeVoiceCommand(command) {
            const cmd = command.toLowerCase().trim();
            let matched = null;
            
            // 查找匹配的命令
            for (const [keyword, action] of Object.entries(voiceCommands)) {
                if (cmd.includes(keyword.toLowerCase())) {
                    matched = action;
                    break;
                }
            }
            
            if (matched) {
                if (matched.type === 'stop') {
                    // 停止所有动作
                    sendCommand('0');
                    updateStatus('🎙️ 停止');
                } else if (matched.type === 'press') {
                    // 瞬时按键（按下后立即松开）
                    sendCommandButton(matched.key, 'down');
                    setTimeout(() => {
                        sendCommandButton(matched.key, 'up');
                    }, 200);
                    updateStatus(`🎙️ ${matched.key.toUpperCase()}`);
                } else {
                    // 方向键（按下）
                    sendCommandButton(matched.key, matched.type);
                    updateStatus(`🎙️ ${matched.key.toUpperCase()}`);
                }
                return true;
            }
            
            return false;
        }

        // 发送按钮命令
        function sendCommandButton(key, type) {
            fetch(`/cmd-button?key=${key}&type=${type}`);
        }

        // 发送方向命令
        function sendCommand(cmd) {
            fetch(`/cmd-button?key=${cmd}&type=down`);
        }

        // 初始化语音识别
        function initVoiceRecognition() {
            // 检查浏览器支持
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert('您的浏览器不支持语音识别功能。\n\n请使用 Chrome、Edge 或 Firefox 浏览器。');
                return false;
            }
            
            recognition = new SpeechRecognition();
            recognition.continuous = true; // 持续识别
            recognition.interimResults = false; // 只要最终结果
            recognition.lang = 'zh-CN'; // 默认中文
            
            // 识别结果处理
            recognition.onresult = (event) => {
                const lastResult = event.results[event.results.length - 1];
                const transcript = lastResult[0].transcript;
                const confidence = lastResult[0].confidence;
                
                console.log(`语音识别: "${transcript}" (置信度: ${Math.round(confidence * 100)}%)`);
                
                // 只显示高置信度的结果
                if (confidence > 0.6) {
                    if (executeVoiceCommand(transcript)) {
                        yoloStatusText.textContent = `"${transcript}"`;
                    } else {
                        yoloStatusText.textContent = `未识别: "${transcript}"`;
                    }
                }
            };
            
            recognition.onerror = (event) => {
                console.error('语音识别错误:', event.error);
                if (event.error === 'not-allowed') {
                    alert('麦克风权限被拒绝。请在浏览器设置中允许麦克风访问。');
                    voiceEnabled = false;
                    voiceBtn.style.backgroundColor = '';
                    voiceBtn.classList.remove('bg-red-500');
                } else if (event.error === 'no-speech') {
                    // 没有检测到语音，忽略
                } else {
                    updateStatus('🎙️ Error: ' + event.error);
                }
            };
            
            recognition.onend = () => {
                if (voiceEnabled) {
                    // 如果语音控制仍然启用，重新启动识别
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log('语音识别重启失败:', e);
                    }
                }
            };
            
            recognition.onstart = () => {
                updateStatus('🎙️ Listening...');
            };
            
            return true;
        }

        // 切换语音控制
        function toggleVoiceControl() {
            if (!voiceEnabled) {
                // 开启语音控制
                if (!recognition) {
                    const initialized = initVoiceRecognition();
                    if (!initialized) return;
                }
                
                try {
                    recognition.start();
                    voiceEnabled = true;
                    voiceBtn.style.backgroundColor = '#FF6B6B'; // 红色表示开启
                    voiceBtn.classList.add('animate-pulse');
                    yoloStatusText.textContent = 'Voice ON';
                    updateStatus('🎙️ Voice ON');
                } catch (e) {
                    console.error('启动语音识别失败:', e);
                }
            } else {
                // 关闭语音控制
                voiceEnabled = false;
                if (recognition) {
                    recognition.stop();
                }
                voiceBtn.style.backgroundColor = ''; // 恢复蓝色
                voiceBtn.classList.remove('animate-pulse');
                yoloStatusText.textContent = 'Voice OFF';
                updateStatus('🎙️ Voice OFF');
            }
        }

        // 语音按钮事件
        voiceBtn.addEventListener('mousedown', () => {
            voiceBtn.classList.add('button-press');
            toggleVoiceControl();
        });
        voiceBtn.addEventListener('mouseup', () => {
            voiceBtn.classList.remove('button-press');
        });
        voiceBtn.addEventListener('mouseleave', () => {
            voiceBtn.classList.remove('button-press');
        });

        // 触摸事件
        voiceBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            voiceBtn.classList.add('button-press');
            toggleVoiceControl();
        });
        voiceBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            voiceBtn.classList.remove('button-press');
        });
    </script>
