<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSH-MOG</title>
    <script src="ps2.js"></script>
    <link href="ps2.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ps2gray: '#C0C0C0',
                        ps2dark: '#333333',
                        ps2red: '#D22B2B',
                        ps2green: '#32CD32',
                        ps2blue: '#1E90FF',
                        ps2yellow: '#FFD700',
                        ps2black: '#1A1A1A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .d-pad {
                @apply relative w-32 h-32 md:w-40 md:h-40 mx-auto;
            }
            .d-pad-button {
                @apply absolute bg-ps2black rounded-md flex items-center justify-center transition-all duration-100 active:scale-90;
            }
            .button-press {
                @apply scale-90 shadow-inner;
            }
            .analog-stick {
                @apply w-16 h-16 md:w-20 md:h-20 rounded-full bg-ps2dark border-4 border-gray-700 relative mx-auto transition-all duration-100;
            }
            .analog-dot {
                @apply absolute w-8 h-8 md:w-10 md:h-10 bg-ps2black rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-all duration-100;
            }
            .action-button {
                @apply w-10 h-10 md:w-14 md:h-14 rounded-full flex items-center justify-center text-white font-bold text-sm md:text-lg transition-all duration-100 active:scale-90 shadow-lg;
            }
            .vertical-button {
                @apply flex flex-col items-center gap-1;
            }
            * {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 md:p-4" onselectstart="return false">
    <div class="w-full max-w-[800px] mx-auto">
        <div class="bg-ps2gray rounded-2xl md:rounded-3xl p-4 md:p-8 shadow-2xl border-4 md:border-8 border-ps2black relative overflow-hidden">       
            <div class="absolute top-0 left-0 w-full h-2 md:h-4 bg-ps2black opacity-30"></div>
            <div class="absolute bottom-0 left-0 w-full h-2 md:h-4 bg-ps2black opacity-30"></div>
            
            <div class="flex flex-col md:flex-row gap-0 items-center">
                <div class="flex flex-col items-center gap-1 w-full md:w-1/3">
                    <div class="d-pad">
                        <div id="up" class="d-pad-button w-8 h-12 md:w-10 md:h-16 top-0 left-1/2 transform -translate-x-1/2">
                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">↑</span>
                        </div>
                        <div id="down" class="d-pad-button w-8 h-12 md:w-10 md:h-16 bottom-0 left-1/2 transform -translate-x-1/2">
                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">↓</span>
                        </div>
                        <div id="left" class="d-pad-button w-12 h-8 md:w-16 md:h-10 top-1/2 left-0 transform -translate-y-1/2">
                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">←</span>
                        </div>
                        <div id="right" class="d-pad-button w-12 h-8 md:w-16 md:h-10 top-1/2 right-0 transform -translate-y-1/2">
                            <span class="text-white font-bold text-xl md:text-2xl tracking-wider">→</span>
                        </div>
                        <div class="absolute w-12 h-12 md:w-16 md:h-16 bg-ps2black rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10"></div>
                    </div>
                    
                    <div class="flex flex-col items-center">
                        <span class="text-ps2black font-bold mb-1 md:mb-2 text-sm">L3</span>
                        <div id="left-analog" class="analog-stick">
                            <div id="left-analog-dot" class="analog-dot"></div>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col items-center gap-2 md:gap-6 w-3/4">
                    <div class="flex items-center gap-2 md:gap-4">
                        <div class="vertical-button items-center">
                            <div id="select" class="w-6 h-8 md:w-6 md:h-10 bg-ps2black rounded-full flex items-center justify-center transition-all duration-100 active:scale-90">
                                <span class="text-white text-sm">⏹</span>
                            </div>
                        </div>

                        <div class="w-40 h-8 md:w-60 md:h-12 bg-ps2black rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-base md:text-2xl tracking-wider">RUSH-MOG</span>
                        </div>

                        <div class="vertical-button items-center">
                            <div id="start" class="w-6 h-8 md:w-6 md:h-10 bg-ps2black rounded-full flex items-center justify-center transition-all duration-100 active:scale-90">
                                <span class="text-white text-sm">▶</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-2 border-2 md:border-4 border-ps2black rounded-lg bg-black overflow-hidden relative" style="max-width: 320px; max-height: 205px;">
                        <img 
                            id="camera" 
                            src="unimog.jpeg" 
                            alt="Camera Stream" 
                            width="320" 
                            height="205"
                            class="object-cover"
                            style="max-width: 320px; max-height: 205px; width: auto; height: auto;"
                        />
                        <canvas 
                            id="detection-canvas" 
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"
                            width="320" 
                            height="205"
                        ></canvas>
                        <div id="camera-status" class="absolute top-1 right-1 flex items-center gap-1 bg-black bg-opacity-50 px-2 py-0.5 rounded text-xs text-white">
                            <span id="camera-status-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
                            <span id="camera-status-text">Click picture to start</span>
                        </div>
                        <div id="yolo-status" class="absolute bottom-1 left-1 flex items-center gap-1 bg-black bg-opacity-50 px-2 py-0.5 rounded text-xs text-white">
                            <span id="yolo-status-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
                            <span id="yolo-status-text">YOLO Off</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col items-center gap-3 md:gap-6 w-1/3">
                    <div class="relative w-28 h-28 md:w-36 md:h-36">
                        <div id="triangle" class="action-button bg-ps2blue absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/4">△</div>
                        <div id="circle" class="action-button bg-ps2red absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1/4">○</div>
                        <div id="cross" class="action-button bg-ps2green absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/4">×</div>
                        <div id="square" class="action-button bg-ps2yellow absolute left-0 top-1/2 transform -translate-y-1/2 -translate-x-1/4">□</div>
                    </div>
                    
                    <div class="flex flex-col items-center">
                        <span class="text-ps2black font-bold mb-1 text-sm">R3</span>
                        <div id="right-analog" class="analog-stick">
                            <div id="right-analog-dot" class="analog-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-3 md:mt-4 flex items-stretch w-full gap-2">
                <div class="flex flex-col h-[60px] md:h-[60px] w-12 md:w-16 shrink-0">
                    <div id="l1" class="h-1/2 bg-ps2black rounded-md flex items-center justify-center text-white font-bold text-sm transition-all duration-100 active:scale-95">L1</div>
                    <div id="l2" class="h-1/2 bg-ps2dark rounded-md flex items-center justify-center text-white font-bold text-sm mt-0.5 transition-all duration-100 active:scale-95">L2</div>
                </div>

                <div id="status" class="bg-ps2black text-white p-2 md:p-3 rounded-md h-[60px] md:h-[60px] flex-1 grid grid-cols-1 md:grid-cols-4 items-center gap-1 overflow-hidden flex-wrap">
                    <div class="bg-gray-600 p-1 md:p-1 rounded text-xs md:text-sm flex items-center justify-center">No input detected</div>
                </div>

                <div class="flex flex-col h-[60px] md:h-[60px] w-14 md:w-16 shrink-0">
                    <div id="yolo-btn" class="h-full bg-ps2green rounded-md flex items-center justify-center text-white font-bold text-xl md:text-4xl transition-all duration-100 active:scale-95 cursor-pointer" title="Toggle YOLO Detection">&#x1F99E;</div>
                </div>

                <div class="flex flex-col h-[60px] md:h-[60px] w-14 md:w-16 shrink-0">
                    <div id="voice-btn" class="h-full bg-ps2red rounded-md flex items-center justify-center text-white font-bold text-xl md:text-4xl transition-all duration-100 active:scale-95 cursor-pointer">&#x1F399;&#xFE0F;</div>
                </div>

                <div class="flex flex-col h-[60px] md:h-[60px] w-12 md:w-16 shrink-0">
                    <div id="r1" class="h-1/2 bg-ps2black rounded-md flex items-center justify-center text-white font-bold text-sm transition-all duration-100 active:scale-95">R1</div>
                    <div id="r2" class="h-1/2 bg-ps2dark rounded-md flex items-center justify-center text-white font-bold text-sm mt-0.5 transition-all duration-100 active:scale-95">R2</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusElement = document.getElementById('status');
        const maxStatusEntries = 4;
        let statusEntries = [];
        
        function updateStatus(button) {
            statusEntries.unshift(`${button}`);
            if (statusEntries.length > maxStatusEntries) {
                statusEntries = statusEntries.slice(0, maxStatusEntries);
            }
            statusElement.innerHTML = '';
            statusEntries.forEach(entry => {
                const el = document.createElement('div');
                el.className = 'bg-gray-800 p-1 md:p-1 rounded text-xs md:text-sm items-center justify-center';
                el.textContent = entry;
                statusElement.appendChild(el);
            });
        }
        
        const buttons = ['up','down','left','right','triangle','circle','cross','square','select','start','l1','r1','l2','r2'];
        buttons.forEach(buttonId => {
            const btn = document.getElementById(buttonId);
            if(!btn) return;
            
            btn.addEventListener('mousedown', () => {
                btn.classList.add('button-press');
                updateStatus(buttonId.toUpperCase()+"-down");
                fetch(`/cmd-button?key=${buttonId}&type=down`);
            });
            btn.addEventListener('mouseup', () => {
                btn.classList.remove('button-press');
                updateStatus(buttonId.toUpperCase()+"-up");
                fetch(`/cmd-button?key=${buttonId}&type=up`);
            });
            btn.addEventListener('mouseleave', () => btn.classList.remove('button-press'));
            
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                btn.classList.add('button-press');
                updateStatus(buttonId.toUpperCase()+"-down");
                fetch(`/cmd-button?key=${buttonId}&type=down`);
            });
            btn.addEventListener('touchend', e => {
                e.preventDefault();
                btn.classList.remove('button-press');
                updateStatus(buttonId.toUpperCase()+"-up");
                fetch(`/cmd-button?key=${buttonId}&type=up`);
            });
        });
        
        function setupAnalogStick(stickId, dotId) {
            const stick = document.getElementById(stickId);
            const dot = document.getElementById(dotId);
            let isDragging = false;
            const stickRect = stick.getBoundingClientRect();
            const centerX = stickRect.width/2, centerY = stickRect.height/2;
            const maxDist = centerX - 10;
            let throttle = false;
            
            stick.addEventListener('mousedown', start);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', end);
            
            dot.addEventListener('touchstart', e => {e.preventDefault(); start(getTouch(e));});
            document.addEventListener('touchmove', e => {e.preventDefault(); drag(getTouch(e));});
            document.addEventListener('touchend', e => {e.preventDefault(); end();});
            
            function getTouch(e) {const t=e.touches[0]; return {clientX:t.clientX, clientY:t.clientY};}
            function start(e) {isDragging=true; drag(e);}
            function end() {if(!isDragging) return; isDragging=false; dot.style.transform='translate(-50%,-50%)'; updateStatus(stickId.split('-')[0].toUpperCase()+'3 (stop, 0)'); fetch(`/cmd-stick?stickId=${stickId}&direct=stop&stepValue=0`);}
            
            function drag(e) {
                if(!isDragging || throttle) return;
                throttle=true; setTimeout(()=>throttle=false, 200);
                
                const rect = stick.getBoundingClientRect();
                const x = e.clientX - (rect.left+centerX);
                const y = e.clientY - (rect.top+centerY);
                const dist = Math.hypot(x,y);
                const fx = dist>maxDist ? x/dist*maxDist : x;
                const fy = dist>maxDist ? y/dist*maxDist : y;
                dot.style.transform = `translate(-50%,-50%) translate(${fx}px,${fy}px)`;
                
                const nx = (fx/maxDist).toFixed(2);
                const ny = (fy/maxDist).toFixed(2);
                const dir = getDir(nx,ny);
                updateStatus(`${stickId.split('-')[0].toUpperCase()}3 (${dir.direct}, ${dir.stepValue})`);
                fetch(`/cmd-stick?stickId=${stickId}&direct=${dir.direct}&stepValue=${dir.stepValue}`);
            }
            
            function getDir(x,y) {
                x=parseFloat(x); y=parseFloat(y);
                let tan = Math.abs(y/x) || 99;
                let d;
                if(tan>2.414) d=y<0?'up':'down';
                else if(tan<0.414) d=x<0?'left':'right';
                else {
                    if(x<0&&y<0)d='uple';
                    else if(x>0&&y<0)d='uprt';
                    else if(x<0&&y>0)d='dnle';
                    else d='dnrt';
                }
                return {direct:d, stepValue: Math.round(Math.hypot(x,y)*9)};
            }
        }
        
        setupAnalogStick('left-analog','left-analog-dot');
        setupAnalogStick('right-analog','right-analog-dot');

        const cameraImg = document.getElementById('camera');
        const statusDot = document.getElementById('camera-status-dot');
        const statusText = document.getElementById('camera-status-text');
        const defaultImage = 'unimog.jpeg';
        const streamUrl = '/stream';
        let isStreaming = false;
        let retryCount = 0;
        const maxRetries = 3;
        let isStopping = false;

        function startCameraStream() {
            if (isStreaming) return;
            isStopping = false;
            isStreaming = true;
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500';
            statusText.textContent = 'Connecting...';
            cameraImg.src = streamUrl + '?t=' + Date.now();
        }

        function stopCameraStream() {
            if (!isStreaming) return;
            isStopping = true;
            isStreaming = false;
            retryCount = 0;
            cameraImg.src = '';
            cameraImg.src = defaultImage;
            statusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
            statusText.textContent = 'Click picture to start';
        }

        cameraImg.onerror = function () {
            if (isStopping) {
                isStopping = false;
                return;
            }
            if (isStreaming) {
                isStreaming = false;
                statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                statusText.textContent = 'Stream error';
                retryCount++;
                if (retryCount < maxRetries) {
                    setTimeout(() => {
                        if (isStopping) return;
                        startCameraStream();
                    }, 2000);
                } else {
                    isStopping = true;
                    cameraImg.src = '';
                    cameraImg.src = defaultImage;
                    statusDot.className = 'w-2 h-2 rounded-full bg-gray-500';
                    statusText.textContent = 'Click picture to start';
                }
            }
        };

        cameraImg.onload = function () {
            if (isStreaming && !isStopping) {
                statusDot.className = 'w-2 h-2 rounded-full bg-green-500';
                statusText.textContent = 'Live';
            }
            retryCount = 0;
        };

        const logoElement = document.getElementById('camera');
        logoElement.style.cursor = 'pointer';
        logoElement.addEventListener('click', function () {
            if (isStreaming) stopCameraStream();
            else startCameraStream();
        });
        logoElement.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            logoElement.classList.add('button-press');
            if (isStreaming) stopCameraStream();
            else startCameraStream();
        });
        logoElement.addEventListener('touchend', (e) => {
            e.preventDefault();
            logoElement.classList.remove('button-press');
        });
    </script>
    <script src="yolo.js"></script>
    <script src="audio.js"></script>
</body>
</html>
