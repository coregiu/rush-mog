edge_server:
  # ======================================================================
  # 默认配置：仿真/桌面联调（fake_edge_publisher）
  # 实车请用 config_file:=.../robot.yaml
  # ======================================================================
  vla_engine:
    model_name: "vla_policy_v1"
    inference_rate: 10
    confidence_threshold: 0.6
    # 当前实现未加载真实模型，仅使用规则桩；有 GPU 且接入模型后可改为 cuda
    device: "cpu"
    max_queue_size: 5
    default_linear_speed: 0.3
    default_angular_speed: 0.5

  instruction:
    object_labels:
      cup: ["杯子", "水杯", "马克杯", "cup", "mug"]
      bottle: ["瓶子", "水瓶", "bottle"]
      person: ["人", "人员", "person"]
      box: ["盒子", "箱子", "box"]
      ball: ["球", "小球", "ball"]
    waypoints: {}
    home_pose: [0.0, 0.0, 0.0]

  action_generator:
    max_linear_speed: 0.8
    max_angular_speed: 1.0
    acceleration_limit: 0.3
    # v2：VLA 单步速度先发到 /cmd_vel_raw，由 velocity_mux 仲裁
    cmd_vel_topic: "/cmd_vel_raw"

  velocity_mux:
    publish_rate: 20
    status_rate: 5
    default_timeout: 0.5
    max_linear: 1.0
    max_angular: 1.5
    priorities:
      safety: 0
      reverse: 1
      teleop: 2
      nav: 3
      vla: 4
    timeouts:
      safety: 0.6
      reverse: 0.6
      teleop: 0.5
      nav: 0.6
      vla: 0.6
    topics:
      safety: "/safety/cmd_vel_override"
      reverse: "/reverse/cmd_vel"
      teleop: "/teleop/cmd_vel"
      nav: "/nav/cmd_vel"
      vla: "/cmd_vel_raw"

  reverse_operation:
    reverse_speed: 0.3
    reverse_distance: 0.5
    operation_timeout: 5.0
    emergency_stop_on_high_risk: true
    arm_joint_names: ["j1", "j2", "j3", "j4", "j5"]
    arm_home_positions: [0.0, 1.57, 0.0, 1.0, 0.5]

  safety:
    obstacle_stop_distance: 0.5
    obstacle_clear_distance: 0.7
    max_twist_x: 1.0
    max_twist_z: 1.5
    data_timeout_sec: 2.0
    scan_timeout_sec: 1.0
    laser_front_fov_deg: 60.0
    laser_rear_fov_deg: 60.0
    laser_side_fov_deg: 45.0
    battery_low_percent: 15.0
    stop_on_low_battery: true
    require_localization_for_nav: true
    localization_timeout_sec: 2.0
    localization_grace_sec: 1.5
    joint_limits:
      j1: [-3.14, 3.14]
      j2: [-1.57, 2.09]
      j3: [-1.57, 2.09]
      j4: [-3.14, 3.14]
      j5: [-3.14, 3.14]

  task_manager:
    task_timeout_sec: 30.0
    reverse_timeout_sec: 5.0
    status_rate: 2.0
    # 单步任务桩：检测到非零控制指令后保持执行窗口，再判定任务成功
    execution_hold_sec: 1.0

  mission:
    default_timeout_sec: 300.0
    map_timeout_sec: 300.0
    map_target_coverage: 0.90
    save_map_after_mapping: true

  time_sync:
    # image/laser/odom 使用近似时间同步；audio/joint/imu 取最近值
    sync_window_ms: 100
    queue_size: 10

  sensor_topics:
    image: "/edge/video"
    laser: "/edge/radar"
    audio: "/edge/audio"
    odom: "/robot/odometry"
    joint_states: "/robot/joint_states"
    imu: "/imu/data"

  # 仿真默认不连串口；实车 robot.yaml 中 enabled: true
  base:
    enabled: false
    port: "/dev/ttyUSB0"
    baud: 921600
    send_rate_hz: 30.0
    watchdog_sec: 0.5
    odom_frame: "odom"
    base_frame: "base_link"
    imu_frame: "imu_link"
    wheel_radius: 0.048
    wheelbase_x: 0.20
    track_y: 0.18
    encoder_cpr: 1320.0
    sign_fl: 1.0
    sign_fr: 1.0
    sign_rl: 1.0
    sign_rr: 1.0
    battery_full_v: 12.6
    battery_empty_v: 10.0
    wheel_joint_names:
      - "wheel_front_left_joint"
      - "wheel_front_right_joint"
      - "wheel_rear_left_joint"
      - "wheel_rear_right_joint"

  imu:
    enabled: false
    i2c_bus: 1
    address: "0x68"
    frame_id: "imu_link"
    rate_hz: 100.0
    accel_fs: 1        # ±4g
    gyro_fs: 2         # ±1000dps
    dlpf: 3
    expected_rate_hz: 100.0
    max_gap_sec: 0.2
    mag_norm_min_ut: 10.0
    mag_norm_max_ut: 120.0
    mag_disturb_ratio: 0.35
    mag_declination_rad: 0.0
    mount_yaw_rad: 0.0
    mag_blend: 0.02
    calibration:
      accel_bias: [0.0, 0.0, 0.0]
      gyro_bias: [0.0, 0.0, 0.0]
      mag_bias: [0.0, 0.0, 0.0]
      mag_scale: [1.0, 1.0, 1.0]

  localization:
    pose_rate: 10.0
    status_rate: 2.0
    odom_timeout_sec: 0.5
    imu_timeout_sec: 0.3
    amcl_timeout_sec: 1.0
    min_quality: 0.35
    map_frame: "map"
    base_frame: "base_link"

  map_manager:
    map_frame: "map"
    map_dir: "~/.ros/rush_mog/maps"
    default_map_name: ""
    publish_rate: 1.0
    frontier_min_size: 5
    frontier_max_count: 50
    frontier_max_cells: 250000
    prefer_slam_toolbox: true

  navigation:
    # auto = 有 Nav2 用 Nav2，否则内置直航；也可强制 nav2 / direct
    backend: "auto"
    nav2_action: "/navigate_to_pose"
    default_timeout_sec: 120.0
    tolerance_xy: 0.20
    tolerance_yaw: 0.30
    min_localization_quality: 0.35
    require_scan: true
    stuck_timeout_sec: 6.0
    progress_min_m: 0.05
    blocked_timeout_sec: 5.0
    status_rate: 2.0
    cmd_topic: "/nav/cmd_vel"
    direct:
      max_linear_speed: 0.35
      max_angular_speed: 1.0
      k_linear: 1.2
      k_angular: 1.8
      slow_radius: 0.6
      min_linear: 0.04
      holonomic: true
      turn_in_place_rad: 0.8
      obstacle_stop_distance: 0.35
      obstacle_slow_distance: 0.8

  perception:
    enabled: false
    image_topic: "/camera/image_raw"
    detector: "color"      # color / yolo / none
    publish_rate: 10.0
    min_confidence: 0.5
    lidar_window_deg: 6.0
    prefer_lidar: true
    position_frame: "map"
    track_max_age_sec: 1.0
    camera:
      width: 640
      height: 480
      hfov_deg: 62.0
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0
    targets:
      cup:
        hsv_min: [0, 100, 60]
        hsv_max: [10, 255, 255]
        min_area_ratio: 0.002
        max_area_ratio: 0.5
        real_height_m: 0.12
      bottle:
        hsv_min: [35, 80, 40]
        hsv_max: [85, 255, 255]
        min_area_ratio: 0.002
        max_area_ratio: 0.5
        real_height_m: 0.22

  search:
    rate_hz: 5.0
    confirm_hits: 3
    confirm_time_sec: 0.4
    standoff_distance: 0.6
    approach_tolerance: 0.30
    map_wait_timeout_sec: 20.0
    target_lost_timeout_sec: 3.0
    frontier_min_size: 5
    max_frontier_distance: 15.0
    blacklist_radius: 0.8
    blacklist_sec: 30.0
    replan_delay_sec: 0.5
    min_confidence: 0.5
    max_approach_failures: 3
    default_max_duration_sec: 300.0
    default_target_coverage: 0.90
    feedback_interval_sec: 0.5
    track_memory_sec: 2.0

  # ======================================================================
  # Edge Server 网页/API（仿真默认不启动 edge_server_node；如需联调可显式启动）
  # 避免占用 80/8080：仿真使用 8081/8082，且不接相机。
  # ======================================================================
  edge:
    web:
      host: "127.0.0.1"
      port: 8081
      stream_port: 8082
      root: ""
      sdcard_dir: ""
    camera:
      enabled: false
      topic: "/camera/image_raw"
      fps: 10
      quality: 70
    motion:
      keepalive_ms: 200
      raw_lease_sec: 1.0
      resend_manual: false
    # 蓝牙音箱/语音播报（仿真默认关闭；实车 robot.yaml/deploy.yaml 打开）
    speaker:
      enabled: false
      device_name: "newmine"
      device_mac: ""              # 留空则按名称扫描发现；填 MAC 可快速重连
      auto_connect: true
      connect_interval_sec: 20
      scan_timeout_sec: 10
      connect_timeout_sec: 20
      sink_wait_sec: 8
      volume: 70
      audio_dir: "~/.local/share/rush-mog/audio"
      say_topic: "/body/say"
      status_topic: "/body/audio_status"
      status_rate_hz: 1.0
      # 同一台 newmine 的 HFP 麦克风；录音时临时切 HFP，停止后恢复 A2DP
      microphone:
        enabled: false
        record_dir: ""            # 空 = <audio_dir>/mic
        sample_rate: 8000
        channels: 1
        chunk_ms: 100
        max_duration_sec: 60
        volume: 100
        topic: "/edge/audio"
        status_topic: "/body/mic_status"
        status_rate_hz: 1.0
      tts:
        backend: "auto"           # auto/espeak-ng/edge-tts/none
        voice: "cmn"              # espeak-ng 中文；英文可用 en-us
        speed: 150
        pitch: 50
        max_chars: 200
    # 树莓派电源监控：vcgencmd get_throttled + rpi_volt，正常即代表电源及转换板正常
    power:
      enabled: false
      sample_interval_sec: 2.0
      status_rate_hz: 1.0
      status_topic: "/body/power_status"
      model_path: "/proc/device-tree/model"
      alarm_path: ""              # 空=自动查找 rpi_volt hwmon
      vcgencmd: "vcgencmd"
    ros_health_url: "http://127.0.0.1:8090/ros/health"
    ros_params_url: "http://127.0.0.1:8090/ros/params"
    state_file: "~/.config/rush-mog/edge_params.json"

  # ======================================================================
  # 健康检查（health_monitor_node）
  #   GET  http://127.0.0.1:8090/ros/health   -> Edge Server / dashboard
  #   ROS  /center/health + /center/healthcheck
  # 接口契约与字段语义见 software/edge_server/HEALTHCHECK.md。
  # 仿真默认：camera/lidar/odom/arm 由 fake_edge_publisher 提供；
  # imu/microphone/speaker 为可选；base/battery 关闭。
  # ======================================================================
  health:
    enabled: true
    publish_rate: 1.0
    startup_grace_sec: 5.0
    rate_window_sec: 5.0
    min_rate_ratio: 0.5
    strict_unknown: false       # true: 可选设备无反馈也视为 degraded
    safety_required: true
    safety_timeout_sec: 3.0
    check_nodes: true
    expected_nodes:
      - bridge_node
      - vla_inference_node
      - action_generator_node
      - reverse_operation_node
      - safety_manager_node
      - task_manager_node
      - health_monitor_node
    http:
      enabled: true
      host: "127.0.0.1"        # Edge Server 同机代理；跨机监控再改 0.0.0.0 + api_key
      port: 8090
      api_key: ""
      cors_allow_origin: "*"
    devices:
      camera:
        type: camera
        topic: "/edge/video"
        message_type: "sensor_msgs/msg/Image"
        expected_rate_hz: 10.0
        timeout_sec: 2.0
        required: true
      lidar:
        type: lidar
        topic: "/edge/radar"
        message_type: "sensor_msgs/msg/LaserScan"
        expected_rate_hz: 10.0
        timeout_sec: 1.5
        required: true
      imu:
        type: imu
        topic: "/imu/data"
        message_type: "sensor_msgs/msg/Imu"
        expected_rate_hz: 100.0
        timeout_sec: 1.0
        required: false
      microphone:
        type: microphone
        topic: "/body/mic_status"
        message_type: "std_msgs/msg/String"
        expected_rate_hz: 1.0
        timeout_sec: 3.0
        required: false
        description: "newmine Bluetooth HFP microphone status"
      speaker:
        type: speaker
        topic: "/body/audio_status"
        message_type: "std_msgs/msg/String"
        expected_rate_hz: 1.0
        timeout_sec: 3.0
        required: false
      arm:
        type: arm
        topic: "/robot/joint_states"
        message_type: "sensor_msgs/msg/JointState"
        joint_names: ["j1", "j2", "j3", "j4", "j5"]
        expected_rate_hz: 10.0
        timeout_sec: 2.0
        required: true
      power:
        enabled: false
        type: power
        topic: "/body/power_status"
        message_type: "std_msgs/msg/String"
        expected_rate_hz: 1.0
        timeout_sec: 3.0
        required: false
        description: "Raspberry Pi power monitor (vcgencmd throttled + rpi_volt)"
      odom:
        type: odometry
        topic: "/robot/odometry"
        message_type: "nav_msgs/msg/Odometry"
        expected_rate_hz: 10.0
        timeout_sec: 2.0
        required: true
      base:
        enabled: false
        type: base
        topic: "/base/status"
        message_type: "std_msgs/msg/String"
        expected_rate_hz: 1.0
        timeout_sec: 3.0
        required: true
      battery:
        enabled: false
        type: battery
        topic: "/battery_state"
        message_type: "sensor_msgs/msg/BatteryState"
        expected_rate_hz: 1.0
        timeout_sec: 5.0
        required: false
