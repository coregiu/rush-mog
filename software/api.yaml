  subnet: "255.255.255.0"
  channel: 6
  max_clients: 4
  ports:
    http: 80
    mjpeg: 8080
    ros_health: 8090
  note: "树莓派 hostapd 提供该 AP（或接入现有局域网）；手机连上后打开 http://192.168.4.1 进入 PS2 手柄页面。"

x-edge-http:
  implementation: "edge_server/edge_server/edge_web.py（stdlib ThreadingHTTPServer）"
  method_filtering: |
    `POST`：`/cmd`、`/cmd-button`、`/cmd-stick`、`/stop`、`/api/modules/report`、
    `/api/modules/edge/params`、`/api/modules/{id}/params`。
    `GET`：页面/静态资源、`/status`、`/api/body`、`/api/modules*`、`/stream`；
    以及 ROS 健康代理 `/api/modules/ros/health|params`。
  note: "控制类请求建议仍使用文档中的方法，避免中间代理/浏览器行为差异。"

x-edge-motion-keepalive:
  interval_ms: 200
  sustained_commands:
    - "1..9"
    - "A"
    - "B"
    - "C"
    - "two-byte stick commands, e.g. 15"
  clear_commands:
    - "0"
    - "J"
    - "D"
  behavior: |
    Pi Edge Server 保存当前持续运动命令，默认每 200ms 重发给 STM32（dashboard 可配 100–600ms）；两字节摇杆命令
    只重发方向位（如 15 → 1），避免覆盖之后调整的 PWM/微调。ROS `/cmd_vel` 量化的
    raw 命令保留 PWM 第二字节并带 1s 租约；网页手动控制优先于 ROS 导航。
    收到 0 / J / D 或调用 POST /stop 后清除。
  warning: |
    如果客户端只发送按下命令而未发送松开/停止命令，Edge Server 会保持最后一条
    运动命令；页面隐藏/关闭时应发送 button:stop:down 或 POST /stop。

x-edge-command-mapping:
  note: |
    HTTP 控制消息到 STM32 UART 命令的映射（与 edge_server/edge_server/edge_control.py 一致）。
    `down` 为按下事件，`up` 为松开事件；null 表示松开时不发送命令。
  button:
    up:
      down: "1"
      up: "0"
    down:
      down: "2"
      up: "0"
    left:
      down: "3"
      up: "0"
    right:
      down: "4"
      up: "0"
    triangle:
      down: "E"
      up: null
    cross:
      down: "F"
      up: null
    square:
      down: "G"
      up: "I"
    circle:
      down: "H"
      up: "I"
    l1:
      down: "9"
      up: "0"
    r1:
      down: "A"
      up: "0"
    l2:
      down: "B"
      up: "0"
    r2:
      down: "C"
      up: "0"
    start:
      down: "D"
      up: null
    select:
      down: "J"
      up: null
    stop:
      down: "0"
      up: "0"
  stick:
    stickId: "left-analog"
    format: "{direction_prefix}{stepValue}"
    directions:
      up: "1"
      down: "2"
      left: "3"
      right: "4"
      uple: "5"
      uprt: "6"
      dnle: "7"
      dnrt: "8"
    stop: "0"
    zero_step: "0"

x-edge-mjpeg:
  port: 8080
  path: "/stream"
  content_type: "multipart/x-mixed-replace; boundary=frame"
  frame:
    headers:
      - "Content-Type: image/jpeg"
      - "Content-Length: <jpeg_bytes>"
    prefix: '--frame\r\n'
    separator: '\r\n\r\n'
    trailer: '\r\n'
  resolution: "ROS 相机原始分辨率（Edge 侧缩放/编码）"
  jpeg_quality: 70
  target_fps: 10
  notes:
    - "源话题为 ROS /camera/image_raw，由 edge_server_node 的 cv_bridge 转 JPEG。"
    - "端口 80 的 /stream 返回 302 到 8080。"
    - "相机未就绪时端口 8080 返回 503，无响应体。"
    - "多个客户端共享最新帧；客户端断开不影响 ROS 节点。"

x-edge-ros-health:
  node: "health_monitor_node"
  bind: "127.0.0.1:8090"
  paths:
    - "GET /ros/health"
    - "GET /ros/health/devices/{device_id}"
    - "GET/POST /ros/params"
    - "GET /ros/healthz"
    - "GET /ros/readyz"
  proxied_by:
    - "GET /api/modules/ros/health"
    - "GET /api/modules/ros/params"
    - "POST /api/modules/ros/params"
  auth:
    optional: true
    note: "health.http.api_key 非空时，/ros/health 与 /ros/params 需要 Bearer 或 X-API-Key；/ros/healthz、/ros/readyz 保持匿名。"
  docs: "edge_server/HEALTHCHECK.md"

x-center-server:
  service: "rush-mog-center-server"
  version: "0.1.0"
  default_base_url: "http://127.0.0.1:8000"
  transport: http-json
  auth:
    optional: true
    note: "仅当 server.api_key 非空时启用；支持 Bearer 或 X-API-Key。"
    schemes:
      - centerBearer
      - centerApiKey
    protected_paths:
      - "/v1/infer"
      - "/v1/reset"
      - "/v1/warmup"
      - "/v1/model"
    public_paths:
      - "/v1/health"
      - "/v1/healthz"
      - "/health"
      - "/v1/ready"
      - "/readyz"
      - "/healthz"
      - "/livez"
  limits:
    instruction_max_chars: 512
    max_images: 8
    max_body_bytes: 16777216
    max_image_bytes: 6291456
    max_image_pixels: 25000000
    chunk_size:
      min: 1
      max: 1000
    inference_concurrency: "单进程串行（引擎 RLock）"
  cors:
    allow_methods: ["GET", "POST", "OPTIONS"]
    allow_headers: ["Content-Type", "Authorization", "X-API-Key", "X-Request-ID"]
    expose_headers: ["X-Request-ID"]
    allow_origin: "server.cors_allow_origin（默认 *）"
  root_response:
    description: "GET / 的服务信息响应；为避免与 Edge Server 的 GET / 冲突，不单独占用 OpenAPI path。"
    value:
      ok: true
      service: "rush-mog-center-server"
      version: "0.1.0"
      status: "ok"
      endpoints:
        health: "GET /v1/health"
        ready: "GET /v1/ready"
        model: "GET /v1/model"
        infer: "POST /v1/infer"
        reset: "POST /v1/reset"
        warmup: "POST /v1/warmup"

x-body-control-uart:
  module: Body Control
  mcu: STM32F103C8T6
  link:
    stm32_usart: USART3
    stm32_pins: "PB10 TX / PB11 RX"
    peer: "Raspberry Pi Edge Server UART"
    peer_pins: "/dev/rush_base（或 /dev/ttyUSB0）TX/RX"
    baudrate: 115200
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none
    electrical: "3.3V TTL（共地）"
  framing:
    format: "<command_id>[<second_byte>]\\n"
    terminators: ["\\n", "\\r"]
    recommended_terminator: "\\n"
    warning: "不要发送 \\r\\n：固件在 \\r 或 \\n 处都会结束当前帧。"
    max_command_bytes: 2
    receive_buffer_bytes: 4
    note: "命令超过 2 字节时固件只取前 2 字节；超过 4 字节接收缓冲会回绕。"
  ack:
    supported: false
    response: "无"
    note: |
      STM32 不返回命令 ACK，uart_log 输出已关闭。
      USART3 上会周期发送编码器遥测（STM32 -> Pi Edge Server）：
      $B,<seq>,<uptime_ms>,<fl>,<fr>,<rl>,<rr>,<distance_mm>,<cliff_mask>\n
      轮速单位 mm/s，里程单位 mm；cliff_mask bit0=左前 PB3、bit1=右前 PB4。
      Edge Server 兼容旧 8 字段固件，解析后通过 GET /api/body 和
      GET /api/modules 的 edge.body 暴露，同时发布 ROS /odom 与
      /body/cliff_status。
  second_byte:
    motion_direct: "0-9/A/B/C/D 命令可带 1 位 PWM：0=停，1..9 对应约 11%..100% 占空比。"
    audio_play: "P 命令可带 1 位曲目索引 1..9；不带则播放 V8_STOP（索引 1）。"
    audio_other: "K/L/M/N/O 的第二字节被忽略。"
    speed_trim: "E/F/G/H/I 的第二字节被忽略。"
    reset: "J 的第二字节被忽略。"
  implementation_notes:
    - "K-P 音频命令由 Body Control 支持，但当前 Edge Server 的 /cmd 映射未使用这些命令。"
    - "MODULE_ARM_BOT 在命令表中没有对应命令 ID；arm_roboot_executor.update_state 当前为空实现。"
  related_uarts:
    - name: "JQ6500 音频模块"
      usart: "USART2"
      baudrate: 9600
      direction: "STM32 → JQ6500"
      note: "内部音频链路，不属于整车控制接口。"
  commands:
    - id: "0"
      name: "stop"
      module: "motor_direct"
      description: "停止；清空持续运动。"
      second_byte: "PWM 0-9（一般不带）"
    - id: "1"
      name: "forward"
      module: "motor_direct"
      description: "前进。"
      second_byte: "PWM 0-9"
    - id: "2"
      name: "backward"
      module: "motor_direct"
      description: "后退。"
      second_byte: "PWM 0-9"
    - id: "3"
      name: "strafe_left"
      module: "motor_direct"
      description: "向左横向移动。"
      second_byte: "PWM 0-9"
    - id: "4"
      name: "strafe_right"
      module: "motor_direct"
      description: "向右横向移动。"
      second_byte: "PWM 0-9"
    - id: "5"
      name: "forward_left"
      module: "motor_direct"
      description: "向左前斜向移动。"
      second_byte: "PWM 0-9"
    - id: "6"
