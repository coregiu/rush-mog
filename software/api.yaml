paths:
  /:
    get:
      tags: [Edge Server]
      summary: PS2 手柄网页入口
      description: |
        `GET /` 由 `handleWebRequest()` 映射到 LittleFS 的 `/index.html`。
        页面包含虚拟 PS2 手柄、摄像头画面、语音控制和 YOLO 开关。
        `index.html` 使用 `Cache-Control: no-cache`。
      operationId: edgeIndex
      responses:
        '200':
          description: PS2 手柄页面
          content:
            text/html:
              schema:
                type: string
        '404':
          description: LittleFS 中没有 index.html
          content:
            text/plain:
              schema:
                type: string
              example: "File Not Found - index.html!"
        '500':
          description: 文件打开失败
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to open file"

  /{asset}:
    get:
      tags: [Edge Server]
      summary: LittleFS 静态资源
      description: |
        返回 LittleFS 中的静态文件，Content-Type 按扩展名推断：
        `.html`、`.css`、`.js`、`.json`、`.png`、`.jpg/.jpeg`、`.svg`、
        `.ico`、`.wasm`、`.woff2`、`.bin`。
        路径包含 `..` 时返回 400。未知文件返回 404。
      operationId: edgeGetAsset
      parameters:
        - name: asset
          in: path
          required: true
          description: 已知资源名；也支持 LittleFS 中上传的其它单段文件名。
          schema:
            type: string
            enum:
              - index.html
              - dashboard.html
              - dashboard.css
              - dashboard.js
              - ps2.css
              - ps2.js
              - audio.js
              - yolo.js
              - unimog.jpeg
              - favicon.ico
      responses:
        '200':
          description: 静态文件
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: 路径包含非法字符
          content:
            text/plain:
              schema:
                type: string
              example: "Bad Request"
        '404':
          description: 文件不存在
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 文件打开失败
          content:
            text/plain:
              schema:
                type: string

  /sdcard/{path}:
    get:
      tags: [Edge Server]
      summary: SD 卡静态资源（YOLO 模型/依赖）
      description: |
        从 SD 卡读取文件，例如：
        - `/sdcard/tf.min.js`
        - `/sdcard/coco-ssd.js`
        - `/sdcard/models/coco-ssd/model.json`
        - `/sdcard/models/coco-ssd/group1-shard1of1.bin`

        `path` 是相对 SD 卡根目录的路径，允许包含 `/`；实际请求 URL 中
        需要保留路径分隔符。SD 卡未挂载时返回 503。
      operationId: edgeGetSdcardAsset
      parameters:
        - name: path
          in: path
          required: true
          description: 相对 SD 卡根目录的文件路径，可包含子目录。
          schema:
            type: string
          example: "models/coco-ssd/model.json"
      responses:
        '200':
          description: 文件内容
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: 路径为空或包含 `..`
          content:
            text/plain:
              schema:
                type: string
              example: "Bad Request"
        '404':
          description: 文件不存在
          content:
            text/plain:
              schema:
                type: string
              example: "Sdcard Not Found The File"
        '500':
          description: 文件打开失败
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: SD 卡未挂载
          content:
            text/plain:
              schema:
                type: string
              example: "SD card not mounted"

  /stream:
    get:
      tags: [Edge Server]
      summary: MJPEG 图传（8080）；80 端口返回 302
      description: |
        **8080 端口** `/stream` 返回 `multipart/x-mixed-replace` MJPEG 流，
        每帧 JPEG，boundary 为 `frame`。新连接会关闭旧连接，避免抢帧。

        **80 端口** `/stream` 仅做兼容重定向：
        `302 Location: http://<AP_IP>:8080/stream`。
        页面实际使用 `http://<host>:8080/stream`。
      operationId: edgeMjpegStream
      servers:
        - url: "http://192.168.4.1:8080"
          description: Edge Server MJPEG 端口
      responses:
        '200':
          description: 持续 MJPEG 流
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-cache, no-store, must-revalidate"
            Pragma:
              schema:
                type: string
              example: "no-cache"
            Connection:
              schema:
                type: string
              example: "close"
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '302':
          description: 仅 80 端口；重定向到 8080 的 `/stream`
          headers:
            Location:
              schema:
                type: string
              example: "http://192.168.4.1:8080/stream"
          content:
            text/plain:
              schema:
                type: string
                example: ""
        '503':
          description: 摄像头未就绪（8080）
          content:
            text/plain:
              schema:
                type: string
                example: ""

  /cmd:
    post:
      tags: [Edge Server]
      summary: 统一控制命令入口（纯文本）
      description: |
        请求体是一条纯文本控制消息，最大 32 字符；支持：

        - `button:<key>:<type>`
        - `stick:left-analog:<direct>:<stepValue>`
        - `raw:<command>`：ROS2 专用 Body Control 运动命令，只允许
          `0`、`1`~`9`、`A`~`C`，可带第二字节 PWM `0`~`9`。
          ESP32 保留第二字节并每 200ms 重发；1s 未收到新 raw 命令自动停车。

        示例：`button:up:down`、`button:stop:down`、
        `stick:left-analog:up:5`、`raw:15`、`raw:95`。

        也兼容 `curl -d` 的 `application/x-www-form-urlencoded`：
        当 `plain` 参数为空且存在参数时，使用第一个参数名作为命令。
        无法识别的消息前缀会被忽略，但仍返回 200。

        按键/摇杆到 UART 命令的完整映射见 `x-edge-command-mapping`。
        持续运动命令由 ESP32 默认每 200ms 重发给 STM32（可配 100–600ms），直到收到停止/松开。
      operationId: edgeCmd
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/EdgeControlMessage'
            examples:
              forward:
                summary: 前进按下
                value: "button:up:down"
              stop:
                summary: 停止
                value: "button:stop:down"
              stick:
                summary: 左摇杆向前，速度档 5
                value: "stick:left-analog:up:5"
              ros_forward:
                summary: ROS 前进，PWM 档 5
                value: "raw:15"
              ros_turn:
                summary: ROS 左转，PWM 档 5
                value: "raw:95"
          application/x-www-form-urlencoded:
            schema:
              type: string
              description: 兼容 curl -d；整个请求体被解析为第一个参数名。
            example: "button:up:down"
      responses:
        '200':
          description: 命令已接收（即使前缀无法识别；不代表 STM32 已执行）
          content:
            text/plain:
              schema:
                type: string
              example: "ok"
        '400':
          description: 空命令或命令超过 32 字符
          content:
            text/plain:
              schema:
                type: string
              examples:
                empty:
                  value: "empty command"
                too_long:
                  value: "command too long"

  /cmd-button:
    get:
      tags: [Edge Server]
      summary: 按钮命令（查询参数形式）
      description: |
        旧页面使用的按钮接口；与 `POST /cmd` 的 `button:` 消息共用
        `processCmdButton()`。ESP32 WebServer 注册时未限制方法，GET 是
        页面实际使用的方法。

        有效 key：up/down/left/right/triangle/cross/square/circle/
        l1/r1/l2/r2/start/select/stop。type 为 down/up（`stop` 为兼容写法）。
        未知 key/type 会被忽略，但仍返回 200。
      operationId: edgeCmdButton
      deprecated: true
      parameters:
        - name: key
          in: query
          required: true
          description: 按钮名称
          schema:
            type: string
            enum:
              - up
              - down
              - left
              - right
              - triangle
              - cross
              - square
              - circle
              - l1
              - r1
              - l2
              - r2
              - start
              - select
              - stop
        - name: type
          in: query
          required: true
          description: 按下/松开；`stop` 仅作为 `stop` 键的兼容写法
          schema:
            type: string
            enum: [down, up, stop]
      responses:
        '200':
          description: 已处理（未知 key/type 也会返回 200）
        '400':
          description: 缺少 key 或 type
          content:
            text/plain:
              schema:
                type: string
              example: "400 Bad Request - Missing 'key' or 'type' parameter"

  /cmd-stick:
    get:
      tags: [Edge Server]
      summary: 左摇杆命令（查询参数形式）
      description: |
        旧页面使用的摇杆接口；与 `POST /cmd` 的 `stick:` 消息共用
        `processCmdStick()`。仅接受 `stickId=left-analog`；
        `stepValue` 必须是单个 0-9 数字。未知 stickId/direct 会静默忽略，
        但仍返回 200。direct=stop 或 stepValue=0 时发送停止命令。
      operationId: edgeCmdStick
      deprecated: true
      parameters:
        - name: stickId
          in: query
          required: true
          schema:
            type: string
            enum: [left-analog]
        - name: direct
          in: query
          required: true
          description: 摇杆方向；8 个斜向/直向 + stop
          schema:
            type: string
            enum:
              - stop
              - up
              - down
              - left
              - right
              - uple
              - uprt
              - dnle
              - dnrt
        - name: stepValue
          in: query
          required: true
          description: 速度/PWM 档位 0-9；0 等价停止
          schema:
            type: string
            pattern: '^[0-9]$'
      responses:
        '200':
          description: 已处理（未知方向也会返回 200）
        '400':
          description: 缺少 stickId/direct/stepValue
          content:
            text/plain:
              schema:
                type: string
              example: "400 Bad Request - Missing 'stickId', 'direct' or 'stepValue' parameter"

  /stop:
    get:
      tags: [Edge Server]
      summary: 显式停车
      description: |
        清除 ESP32 的持续运动状态，并向 STM32 发送 `0`。
        页面 pagehide/断线兜底可调用；返回 `stopped`。
      operationId: edgeStop
      responses:
        '200':
          description: 已停车
          content:
            text/plain:
              schema:
                type: string
              example: "stopped"

  /status:
    get:
      tags: [Edge Server]
      summary: ESP32 运行状态
      description: |
        返回 ESP32 的 uptime、剩余堆/PSRAM、摄像头/SD 卡状态和当前是否有
        持续运动。**不包含 STM32 的编码器/IMU/电池等底盘遥测。**
      operationId: edgeStatus
      responses:
        '200':
          description: 状态 JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeStatus'
              example:
                uptime_ms: 123456
                free_heap: 180000
                free_psram: 6500000
                camera: 1
                sdcard: 1
                motion_active: 0

  /api/modules:
    get:
      tags: [Edge Server]
      summary: 模块注册表 + Edge 自身状态
      description: |
        dashboard.html 的主数据源。返回 Edge 自身状态/参数，以及 ROS、CENTER
        等模块最近一次通过 `POST /api/modules/report` 上报的缓存。
        模块超过 15 秒未上报时 `stale=true`。
      operationId: edgeModules
      responses:
        '200':
          description: 模块注册表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeModulesResponse'

  /api/body:
    get:
      tags: [Edge Server]
      summary: STM32 编码器遥测快照
      description: |
        ESP32 从 USART3 解析 STM32 编码器遥测后缓存的最新帧。
        轮速单位 mm/s，distance_mm 为四轮平均绝对里程。
        `valid=false` 表示从未收到；`stale=true` 表示超过 2s 未更新。
      operationId: edgeBody
      responses:
        '200':
          description: 编码器遥测
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  body:
                    type: object
                    properties:
                      valid: {type: boolean}
                      stale: {type: boolean}
                      source: {type: string, example: stm32}
                      rate_hz: {type: number, example: 10}
                      seq: {type: integer}
                      uptime_ms: {type: integer}
                      age_ms: {type: integer}
                      wheel_mm_s:
                        type: array
                        items: {type: integer}
                        minItems: 4
                        maxItems: 4
                      distance_mm: {type: integer}

  /api/modules/report:
    post:
      tags: [Edge Server]
      summary: 模块状态上报（ROS / CENTER）
      description: |
        ROS / CENTER 自动连接 RUSH-MOG Wi-Fi 后，由 `software/tools/edge_link.py`
        周期调用。使用 `application/x-www-form-urlencoded`，字段小，适配
        ESP32 WebServer。模块 IP 以连接来源 `remoteIP` 为准，不信任客户端传入。
      operationId: edgeModuleReport
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EdgeModuleReport'
      responses:
        '200':
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: module/端口/路径非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '507':
          description: 注册表已满（最多 4 个模块）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/modules/{module_id}:
    get:
      tags: [Edge Server]
      summary: 单模块缓存
      description: 返回模块最近一次上报的缓存；`edge` 返回 ESP32 本地状态。
      operationId: edgeModule
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            enum: [edge, ros, center]
      responses:
        '200':
          description: 模块状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeModule'
        '404':
          description: 模块尚未上报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/modules/{module_id}/health:
    get:
      tags: [Edge Server]
      summary: 代理模块健康接口
      description: |
        ESP32 通过已登记的模块 IP + 端口/路径，代理 `GET /ros/health` 或
        `GET /v1/health`，返回模块原始 JSON。模块不可达时返回 502。
      operationId: edgeModuleHealth
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            enum: [edge, ros, center]
      responses:
        '200':
          description: 模块健康 JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: 模块尚未上报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '502':
          description: 模块不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/modules/{module_id}/params:
    get:
      tags: [Edge Server]
      summary: 参数描述（代理/本地）
      description: |
        `edge` 返回 ESP32 本地参数描述；`ros` / `center` 代理模块的
        `/ros/params` / `/v1/params`。
      operationId: edgeModuleParams
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            enum: [edge, ros, center]
      responses:
        '200':
          description: 参数描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleParams'
        '404':
          description: 模块尚未上报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '502':
          description: 模块不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
    post:
      tags: [Edge Server]
      summary: 修改参数（代理/本地）
      description: |
        `edge` 使用 `application/x-www-form-urlencoded`（字段为参数 key）；
        `ros` / `center` 使用 JSON `{"updates": {...}}`，ESP32 原样代理到模块
        参数接口。模块返回的 JSON 原样透传。
      operationId: edgeModuleParamsUpdate
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            enum: [edge, ros, center]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleParamsUpdate'
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 参数已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleParamsUpdateResponse'
        '400':
          description: 参数非法/缺少请求体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '404':
          description: 模块尚未上报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '502':
          description: 模块不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /v1/infer:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口；部署时替换为实际地址）
    post:
      tags: [Center Server]
      summary: SmolVLA 多模态推理
      description: |
        发送语言指令、图像和本体状态，返回 SmolVLA 动作块及第一步映射结果。

        - 首次请求可能触发模型加载（懒加载），耗时较长；生产环境建议
          `model.preload: true` 或先调用 `/v1/warmup`。
        - `images` 相机名可用 `model.image_aliases` 映射到 checkpoint 相机键；
          缺失相机按 `model.missing_image_policy` 补齐。
        - `state` 顺序必须与微调数据一致；不足可补零，超出会截断。
        - 模型动作语义由 `action.mode` 决定：`base_twist`/`hybrid`/`joint`/`raw`。
        - `base_cmd`/`arm_cmd` 只对应动作块第一步；后续步骤见 `actions`。
        - SmolVLA 不提供校准置信度；执行门控（急停/避障/低置信度）由 ROS 负责。
      operationId: centerInfer
      security:
        - {}
        - centerBearer: []
        - centerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterInferRequest'
            examples:
              pick_cup:
                summary: 抓取杯子
                value:
                  instruction: "把红色杯子拿起来"
                  images:
                    front: "data:image/jpeg;base64,/9j/4AAQSkZJRg..."
                  state: [0.0, 0.0, 0.0, 0.0, 1.57, 0.0]
                  task_id: "pick-cup-001"
                  session_id: "robot-01"
                  reset: false
                  options:
                    chunk_size: 8
                    return_mapped: false
      responses:
        '200':
          description: 推理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterInferResponse'
              examples:
                ok:
                  summary: base_twist 模式
                  value:
                    ok: true
                    request_id: "8f0c..."
                    task_id: "pick-cup-001"
                    session_id: "robot-01"
                    instruction: "把红色杯子拿起来"
                    actions: [[0.12, -0.03, 0.05], [0.10, -0.02, 0.04]]
                    action: [0.12, -0.03, 0.05]
                    action_dim: 3
                    chunk_size: 2
                    base_cmd:
                      linear: {x: 0.06, y: -0.012, z: 0.0}
                      angular: {x: 0.0, y: 0.0, z: 0.05}
                    arm_cmd: null
                    mapped:
                      mode: "base_twist"
                      raw: [0.12, -0.03, 0.05]
                      base_cmd:
                        linear: {x: 0.06, y: -0.012, z: 0.0}
                        angular: {x: 0.0, y: 0.0, z: 0.05}
                      arm_cmd: null
                      clipped: false
                    model:
                      backend: "smolvla"
                      path: "lerobot/smolvla_base"
                      device: "cuda"
                      dtype: "float16"
                    latency_ms: 42.7
                    model_latency_ms: 39.1
                    timestamp: "2026-11-07T11:30:00+00:00"
                    warnings: []
        '400':
          $ref: '#/components/responses/CenterBadRequest'
        '401':
          $ref: '#/components/responses/CenterUnauthorized'
        '413':
          $ref: '#/components/responses/CenterPayloadTooLarge'
        '415':
          $ref: '#/components/responses/CenterUnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CenterUnprocessableEntity'
        '500':
          $ref: '#/components/responses/CenterInferenceError'
        '503':
          $ref: '#/components/responses/CenterModelUnavailable'

  /v1/reset:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    post:
      tags: [Center Server]
      summary: 清理策略动作队列/回合状态
      description: |
        调用 `policy.reset()`（若存在）。当前服务无跨请求会话状态，
        `session_id` 仅回显；动作块推理本身是无状态的。
      operationId: centerReset
      security:
        - {}
        - centerBearer: []
        - centerApiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CenterResetRequest'
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterResetResponse'
        '400':
          $ref: '#/components/responses/CenterBadRequest'
        '401':
          $ref: '#/components/responses/CenterUnauthorized'
        '503':
          $ref: '#/components/responses/CenterModelUnavailable'

  /v1/warmup:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    post:
      tags: [Center Server]
      summary: 空推理预热
      description: |
        用黑色 64×64 图像和全零 state 执行一次推理，触发模型加载/编译/显存分配。
        首次调用可能很慢。
      operationId: centerWarmup
      security:
        - {}
        - centerBearer: []
        - centerApiKey: []
      responses:
        '200':
          description: 预热完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterWarmupResponse'
        '400':
          $ref: '#/components/responses/CenterBadRequest'
        '401':
          $ref: '#/components/responses/CenterUnauthorized'
        '503':
          $ref: '#/components/responses/CenterModelUnavailable'

  /v1/model:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 模型/动作 schema 信息
      description: |
        返回 backend、checkpoint 路径、设备、动作模式、相机键、state/action
        维度、chunk 大小等。该接口不触发模型加载；未加载时部分字段来自配置。
      operationId: centerModel
      security:
        - {}
        - centerBearer: []
        - centerApiKey: []
      responses:
        '200':
          description: 模型信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterModelEnvelope'
        '401':
          $ref: '#/components/responses/CenterUnauthorized'

  /v1/params:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 动作映射/限幅参数描述
      description: |
        返回可编辑的 `action.*` 参数：mode、max_linear_x/y、max_angular_z、
        deadband、normalized、arm_start、round_digits；修改会重建 ActionMapper，
        下一次推理生效。不重新加载模型。
      operationId: centerParams
      security:
        - {}
        - centerBearer: []
        - centerApiKey: []
      responses:
        '200':
          description: 参数描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleParams'
        '401':
          $ref: '#/components/responses/CenterUnauthorized'
    post:
      tags: [Center Server]
      summary: 修改动作映射/限幅参数
      description: |
        请求体 `{"updates": {"action.mode": "raw", "action.max_linear_x": 0.7}}`。
        只允许 action.* 白名单；非法值返回 422。
      operationId: centerParamsUpdate
      security:
        - {}
        - centerBearer: []
        - centerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleParamsUpdate'
      responses:
        '200':
          description: 参数已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleParamsUpdateResponse'
        '401':
          $ref: '#/components/responses/CenterUnauthorized'
        '422':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /v1/health:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 详细健康状态
      description: |
        返回服务状态、模型加载状态、设备、错误信息等。
        模型加载失败时仍返回 200，但 `status=degraded`、`ready=false`。
      operationId: centerHealth
      responses:
        '200':
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterHealth'

  /health:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 详细健康状态（别名）
      operationId: centerHealthAlias
      responses:
        '200':
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterHealth'

  /v1/healthz:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 详细健康状态（别名）
      operationId: centerHealthzAlias
      responses:
        '200':
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterHealth'

  /healthz:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 存活探针
      description: 进程存活即返回 200，不检查模型。
      operationId: centerLiveness
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterLive'

  /livez:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 存活探针（别名）
      operationId: centerLivenessAlias
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterLive'

  /v1/ready:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 就绪探针
      description: |
        模型已加载（或 stub 后端）返回 200；否则返回 503。
        默认懒加载时，首次推理前 `/v1/ready` 为 503；使用 readiness 探针时
        建议设置 `model.preload: true`，或改用 `/healthz`。
      operationId: centerReady
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterReady'
        '503':
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterReady'

  /readyz:
    servers:
      - url: "http://127.0.0.1:8000"
        description: Center Server（默认端口）
    get:
      tags: [Center Server]
      summary: 就绪探针（别名）
      operationId: centerReadyAlias
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterReady'
        '503':
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterReady'

  /ros/health:
    servers:
      - url: "http://127.0.0.1:8090"
        description: ROS Health Gateway（默认只监听回环）
    get:
      tags: [ROS Health Gateway]
      summary: ROS 与全部连接设备的详细健康
      description: |
        返回 ROS 节点/话题状态，以及相机、雷达、IMU、麦克风、音箱、机械臂、
        底盘、电池、里程计等设备的健康情况。HTTP 200 只代表健康数据可读；
        机器健康看 body 的 `status` / `healthy` / `ready`。

        别名：`/v1/health`、`/health`、`/healthcheck`。完整字段、状态语义和
        edge_center 接入示例见 `software/ros/HEALTHCHECK.md`。
      operationId: rosHealth
      security:
        - {}
        - rosHealthBearer: []
        - rosHealthApiKey: []
      parameters:
        - name: include_metrics
          in: query
          required: false
          description: false 时不返回设备 metrics 字段
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 健康快照（整体 status 可为 ok/starting/degraded/error/disabled）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosHealth'
        '401':
          $ref: '#/components/responses/RosHealthUnauthorized'
        '503':
          description: 健康快照尚未生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /ros/health/devices/{device_id}:
    servers:
      - url: "http://127.0.0.1:8090"
        description: ROS Health Gateway（默认只监听回环）
    get:
      tags: [ROS Health Gateway]
      summary: 单个设备健康
      description: |
        返回指定设备详情；`status` 仍是整体系统状态。
        设备 ID 示例：camera / lidar / imu / microphone / speaker / arm / base / battery / odom。
      operationId: rosHealthDevice
      security:
        - {}
        - rosHealthBearer: []
        - rosHealthApiKey: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
        - name: include_metrics
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 单设备健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosHealthDeviceEnvelope'
        '401':
          $ref: '#/components/responses/RosHealthUnauthorized'
        '404':
          description: 未知设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '503':
          description: 健康快照尚未生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /ros/params:
    servers:
      - url: "http://127.0.0.1:8090"
        description: ROS Health Gateway（默认只监听回环）
    get:
      tags: [ROS Health Gateway]
      summary: ROS 健康监控参数描述
      description: |
        返回可编辑的 health monitor 参数（发布频率、宽限期、设备频率/超时/
        必需标志等）和只读 topic/message_type。参数修改运行时生效，重启后
        回到 YAML 配置。
      operationId: rosParams
      security:
        - {}
        - rosHealthBearer: []
        - rosHealthApiKey: []
      responses:
        '200':
          description: 参数描述
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleParams'
        '401':
          $ref: '#/components/responses/RosHealthUnauthorized'
        '404':
          description: 该节点未提供参数接口
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '503':
          description: 参数快照尚未生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
    post:
      tags: [ROS Health Gateway]
      summary: 修改 ROS 健康监控参数
      description: |
        请求体 `{"updates": {"publish_rate": 2.0, "device.lidar.timeout_sec": 2.0}}`；
        也接受 `application/x-www-form-urlencoded`。只允许 health monitor 参数，
        topic/message_type 只读。
      operationId: rosParamsUpdate
      security:
        - {}
        - rosHealthBearer: []
        - rosHealthApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleParamsUpdate'
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: 参数已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleParamsUpdateResponse'
        '400':
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '401':
          $ref: '#/components/responses/RosHealthUnauthorized'
        '503':
          description: 参数快照尚未生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /ros/healthz:
    servers:
      - url: "http://127.0.0.1:8090"
        description: ROS Health Gateway（默认只监听回环）
    get:
      tags: [ROS Health Gateway]
      summary: 存活探针
      description: HTTP 线程存活即 200，不检查设备；等价别名 `/healthz`、`/livez`。
      operationId: rosHealthLiveness
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosHealthLive'

  /ros/readyz:
    servers:
      - url: "http://127.0.0.1:8090"
        description: ROS Health Gateway（默认只监听回环）
    get:
      tags: [ROS Health Gateway]
      summary: 就绪探针
      description: |
        整体 `ok`/`degraded` 且未急停返回 200；`starting`/`error`/`disabled`
        或急停返回 503。等价别名 `/readyz`。
      operationId: rosHealthReadiness
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosHealthReady'
        '503':
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosHealthReady'

  /body-control/uart/command:
    post:
      tags: [Body Control (UART)]
      summary: UART 命令（虚拟归档路径，非 HTTP）
      description: |
        **这不是 HTTP 端点，请勿通过 HTTP 调用。**

        该路径仅用于在 Swagger/OpenAPI 中展示 Body Control 的 UART 命令，
        实际传输为 STM32 USART3：9600 8N1，命令以 `\n` 结束。
        完整的帧格式、命令表、PWM/曲目第二字节语义见
        `x-body-control-uart`。

        固件不在 USART3 上返回 ACK 或遥测；发送成功仅表示字节已写入
        UART，不能证明 STM32 已接收/执行。
      operationId: bodyControlUartCommand
      deprecated: true
      servers:
        - url: "uart://stm32-usart3"
          description: 虚拟 UART 端点（非 HTTP，仅归档）
      x-transport: uart
      x-not-http: true
      x-try-it-out: false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/BodyControlUartCommand'
            examples:
              forward:
                summary: 前进
                value: "1"
              forward_pwm5:
                summary: 前进 + PWM 档 5
                value: "15"
              stop:
                summary: 停止
                value: "0"
              reset:
                summary: 复位
                value: "J"
              audio_play_track2:
                summary: 播放曲目 2
                value: "P2"
      responses:
        '200':
          description: |
            仅文档占位：UART 为 fire-and-forget，没有 HTTP 响应。
            真实链路不返回 ACK/响应体。
          content:
            text/plain:
              schema:
                type: string
              example: "no HTTP response; fire-and-forget UART"

components:
  securitySchemes:
    centerBearer:
      type: http
      scheme: bearer
      description: "Center Server 可选的 Bearer Token（server.api_key）"
    centerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Center Server 可选的 API Key（server.api_key）"
    rosHealthBearer:
      type: http
      scheme: bearer
      description: "ROS Health Gateway 可选的 Bearer Token（health.http.api_key）"
    rosHealthApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "ROS Health Gateway 可选的 API Key（health.http.api_key）"

  responses:
    CenterBadRequest:
      description: 请求格式错误（JSON/图像/base64/长度）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          examples:
            invalid_json:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "invalid_json"
                  message: "JSON 解析失败: ..."
    CenterUnauthorized:
      description: 缺少或错误的 API Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "unauthorized"
              message: "无效或缺失的 API Key"
    RosHealthUnauthorized:
      description: 缺少或错误的 ROS Health API Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "unauthorized"
              message: "无效或缺失的 API Key"
    CenterPayloadTooLarge:
      description: 请求体/图像超限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "payload_too_large"
              message: "请求体超过 16777216 字节"
    CenterUnsupportedMediaType:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "unsupported_media_type"
              message: "Content-Type 必须是 application/json"
    CenterUnprocessableEntity:
      description: 请求语义错误（instruction/图像/state/chunk/相机名等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          examples:
            missing_instruction:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "instruction_required"
                  message: "instruction 不能为空；SmolVLA 需要语言指令"
            missing_image:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "missing_image"
                  message: "缺少图像输入"
            unknown_image:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "unknown_image_key"
                  message: "未知相机名: rear"
                  details:
                    allowed: ["camera1", "camera2", "camera3"]
    CenterInferenceError:
      description: 模型推理内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "inference_error"
              message: "SmolVLA 推理失败: ..."
    CenterModelUnavailable:
      description: torch/lerobot/权重/预处理器不可用，或模型加载失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "model_unavailable"
              message: "未安装 PyTorch，无法加载 SmolVLA"
              details:
                install: "pip install -r requirements-vla.txt"

  schemas:
    EdgeStatus:
      type: object
      description: ESP32-S3 运行状态（不含 STM32 底盘遥测）
      required:
        - uptime_ms
        - free_heap
        - free_psram
        - camera
        - sdcard
        - motion_active
      properties:
        uptime_ms:
          type: integer
          format: int64
          description: ESP32 启动后的毫秒数
        free_heap:
          type: integer
          format: int64
          description: 剩余内部堆
        free_psram:
          type: integer
          format: int64
          description: 剩余 PSRAM；无 PSRAM 时为 0
        camera:
          type: integer
          enum: [0, 1]
          description: 摄像头是否就绪
        sdcard:
          type: integer
          enum: [0, 1]
          description: SD 卡是否挂载
        motion_active:
          type: integer
          enum: [0, 1]
          description: 是否正在持续重发运动命令

    EdgeModuleReport:
      type: object
      description: ROS/CENTER 通过 `POST /api/modules/report` 提交的表单
      required: [module, status]
      properties:
        module:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,16}$'
          example: "ros"
        name:
          type: string
          maxLength: 48
        version:
          type: string
          maxLength: 24
        status:
          type: string
          enum: [ok, starting, degraded, error, unknown, offline, disabled]
        summary:
          type: string
          maxLength: 240
        health_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8090
        health_path:
          type: string
          maxLength: 80
          default: "/ros/health"
        params_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8090
        params_path:
          type: string
          maxLength: 80
          default: "/ros/params"
        params_json:
          type: string
          maxLength: 2048
          description: 精简参数 JSON 字符串；ESP32 原样缓存

    EdgeModule:
      type: object
      required: [id, name, status, updated_ms, stale]
      properties:
        id:
          type: string
          example: "ros"
        name:
          type: string
        version:
          type: string
        ip:
          type: string
          example: "192.168.4.2"
        status:
          type: string
          enum: [ok, starting, degraded, error, unknown, offline, disabled]
        summary:
          type: string
        health_url:
          type: string
        params_url:
          type: string
        updated_ms:
          type: integer
          format: int64
        age_ms:
          type: integer
          format: int64
        stale:
          type: boolean
        params:
          type: object
          additionalProperties: true

    EdgeModulesResponse:
      type: object
      required: [ok, edge, modules, count]
      properties:
        ok:
          type: boolean
          enum: [true]
        server_time_ms:
          type: integer
          format: int64
        edge:
          $ref: '#/components/schemas/EdgeModule'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/EdgeModule'
        count:
          type: integer

    ModuleParam:
      type: object
      required: [key, label, value, type, group, editable]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          nullable: true
          description: 当前值；数字/布尔/字符串
        type:
          type: string
          enum: [int, float, bool, string, enum]
        group:
          type: string
        unit:
          type: string
        min:
          type: number
        max:
          type: number
        step:
          type: number
        options:
          type: array
          items:
            type: string
        editable:
          type: boolean
        requires_restart:
          type: boolean
        help:
          type: string

    ModuleParams:
      type: object
      required: [ok, module, params]
      properties:
        ok:
          type: boolean
          enum: [true]
        module:
          type: string
        name:
          type: string
        version:
          type: string
        editable:
          type: boolean
        requires_restart:
          type: boolean
        params:
          type: array
          items:
            $ref: '#/components/schemas/ModuleParam'

    ModuleParamsUpdate:
      type: object
      required: [updates]
      properties:
        updates:
          type: object
          additionalProperties: true

    ModuleParamsUpdateResponse:
      type: object
      required: [ok, updated]
      properties:
        ok:
          type: boolean
          enum: [true]
        updated:
          type: object
          additionalProperties: true
        requires_restart:
          type: boolean
        message:
          type: string

    EdgeButtonMessage:
      type: string
      description: |
        按钮消息：`button:<key>:<type>`。
        `stop` 键无论 type 如何都映射到停止命令。
      pattern: '^button:(up|down|left|right|triangle|cross|square|circle|l1|r1|l2|r2|start|select|stop):(down|up|stop)$'
      maxLength: 32
      example: "button:up:down"

    EdgeStickMessage:
      type: string
      description: |
        摇杆消息：`stick:left-analog:<direct>:<stepValue>`。
        `direct=stop` 或 `stepValue=0` 等价停止。
      pattern: '^stick:left-analog:(stop|up|down|left|right|uple|uprt|dnle|dnrt):[0-9]$'
      maxLength: 32
      example: "stick:left-analog:up:5"

    EdgeControlMessage:
      description: 纯文本控制消息；两条命令族二选一
      oneOf:
        - $ref: '#/components/schemas/EdgeButtonMessage'
        - $ref: '#/components/schemas/EdgeStickMessage'

    CenterImagePayload:
      type: object
      description: |
        图像对象。可直接传 base64/data URI 字符串，也可用对象形式。
        `data`、`base64`、`image` 三选一；`format` 仅为兼容字段，服务端按
        实际图像内容解码。
      properties:
        data:
          type: string
          description: base64 或 `data:image/...;base64,...`
        base64:
          type: string
          description: "`data` 的别名"
        image:
          type: string
          description: "`data` 的别名"
        format:
          type: string
          description: 可选的格式提示（png/jpeg），当前不强制使用
      anyOf:
        - type: object
          properties:
            data:
              type: string
          required: [data]
        - type: object
          properties:
            base64:
              type: string
          required: [base64]
        - type: object
          properties:
            image:
              type: string
          required: [image]

    CenterInferOptions:
      type: object
      properties:
        chunk_size:
          type: integer
          minimum: 1
          maximum: 1000
          description: 只返回动作块前 N 步；默认返回完整 chunk
        return_mapped:
          type: boolean
          default: false
          description: 为 true 时额外返回每一步的映射结果 `mapped_actions`

    CenterInferRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          maxLength: 512
          description: 语言指令；也接受别名 `task`/`language_instruction`
        images:
          type: object
          maxProperties: 8
          description: |
            `{相机名: base64 | data URI | CenterImagePayload}`。
            相机名可用 `model.image_aliases` 映射到 checkpoint 相机键；
            缺失相机按 `model.missing_image_policy` 处理。
          additionalProperties:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/CenterImagePayload'
        state:
          type: array
          items:
            type: number
          description: 本体状态向量；不足补零，超出截断，顺序需与训练数据一致
        task_id:
          type: string
          maxLength: 128
          description: 回显；为空时使用 request_id
        session_id:
          type: string
          maxLength: 128
          description: 回显；当前无跨请求会话状态
        reset:
          type: boolean
          default: false
          description: 为 true 时先调用 policy.reset()
        options:
          $ref: '#/components/schemas/CenterInferOptions'

    CenterVector3:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number

    CenterBaseCmd:
      type: object
      description: 与 ROS geometry_msgs/Twist 对应的速度命令
      properties:
        linear:
          $ref: '#/components/schemas/CenterVector3'
        angular:
          $ref: '#/components/schemas/CenterVector3'

    CenterMappedAction:
      type: object
      properties:
        mode:
          type: string
          enum: [raw, base_twist, hybrid, joint]
          description: 动作解释模式
        raw:
          type: array
          items:
            type: number
          description: 该步模型原始动作
        base_cmd:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CenterBaseCmd'
        arm_cmd:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: 关节名 -> 角度/位置；raw/base_twist 模式为 null
        clipped:
          type: boolean
          description: 是否发生速度/关节限幅

    CenterModelRef:
      type: object
      properties:
        backend:
          type: string
          enum: [smolvla, stub]
        path:
          type: string
          description: HF 仓库名或本地 checkpoint 目录
        device:
          type: string
          example: "cuda"
        dtype:
          type: string
          example: "float16"

    CenterModelInfo:
      type: object
      description: 模型/动作 schema 与加载状态
      properties:
        backend:
          type: string
          enum: [smolvla, stub]
        path:
          type: string
        loaded:
          type: boolean
        loading:
          type: boolean
        device:
          type: string
        dtype:
          type: string
        action_dim:
          type: integer
          nullable: true
        state_dim:
          type: integer
        chunk_size:
          type: integer
        image_keys:
          type: array
          items:
            type: string
        processors:
          type: boolean
          description: 是否成功构建 LeRobot 预处理器/后处理器
        error:
          type: string
          nullable: true
          description: 最近一次加载失败摘要
        configured_image_keys:
          type: array
          items:
            type: string
        image_aliases:
          type: object
          additionalProperties:
            type: string
        action_mode:
          type: string
          enum: [raw, base_twist, hybrid, joint]

    CenterInferResponse:
      type: object
      required:
        - ok
        - request_id
        - actions
        - action
        - action_dim
        - chunk_size
        - latency_ms
        - timestamp
      properties:
        ok:
          type: boolean
          enum: [true]
        request_id:
          type: string
        task_id:
          type: string
        session_id:
          type: string
        instruction:
          type: string
        actions:
          type: array
          minItems: 1
          description: 动作块，每个元素是一步动作
          items:
            type: array
            items:
              type: number
        action:
          type: array
          items:
            type: number
          description: 动作块第一步
        action_dim:
          type: integer
        chunk_size:
          type: integer
        base_cmd:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CenterBaseCmd'
        arm_cmd:
          type: object
          nullable: true
          additionalProperties:
            type: number
        mapped:
          $ref: '#/components/schemas/CenterMappedAction'
        mapped_actions:
          type: array
          description: 仅 options.return_mapped=true 时返回
          items:
            $ref: '#/components/schemas/CenterMappedAction'
        model:
          $ref: '#/components/schemas/CenterModelRef'
        latency_ms:
          type: number
          description: 服务端总耗时
        model_latency_ms:
          type: number
          description: 模型调用耗时
        timestamp:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string

    CenterHealth:
      type: object
      required: [ok, status, ready, service, version, uptime_sec, model, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
        service:
          type: string
          example: "rush-mog-center-server"
        version:
          type: string
          example: "0.1.0"
        uptime_sec:
          type: number
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        request_id:
          type: string

    CenterReady:
      type: object
      required: [ok, status, model, request_id]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        request_id:
          type: string

    CenterLive:
      type: object
      required: [ok, status, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok]
        request_id:
          type: string

    CenterModelEnvelope:
      type: object
      required: [ok, model, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        request_id:
          type: string

    CenterResetRequest:
      type: object
      properties:
        session_id:
          type: string
          maxLength: 128

    CenterResetResponse:
      type: object
      required: [ok, session_id, message, timestamp, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        session_id:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    CenterWarmupResponse:
      type: object
      required: [ok, latency_ms, model_latency_ms, model, timestamp, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        latency_ms:
          type: number
        model_latency_ms:
          type: number
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    CenterError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          example: "model_unavailable"
        message:
          type: string
          description: 人类可读错误信息
        details:
          type: object
          additionalProperties: true
          description: 可选的上下文信息

    CenterErrorResponse:
      type: object
      required: [ok, error, request_id]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/CenterError'
        request_id:
          type: string

    RosHealthSummary:
      type: object
      required: [total, enabled, ok, degraded, error, unknown, disabled]
      properties:
        total:
          type: integer
        enabled:
          type: integer
        ok:
          type: integer
        degraded:
          type: integer
        error:
          type: integer
        unknown:
          type: integer
        disabled:
          type: integer

    RosDeviceHealth:
      type: object
      required:
        - id
        - type
        - status
        - healthy
        - ready
        - enabled
        - required
        - connected
        - data_fresh
        - topic
        - message_type
        - publisher_count
        - age_sec
        - rate_hz
        - expected_rate_hz
        - detail
      properties:
        id:
          type: string
          example: "camera"
        type:
          type: string
          enum: [camera, lidar, imu, microphone, speaker, arm, base, battery, odometry, other]
        status:
          type: string
          enum: [ok, degraded, error, unknown, disabled]
        healthy:
          type: boolean
        ready:
          type: boolean
        enabled:
          type: boolean
        required:
          type: boolean
        connected:
          type: boolean
        data_fresh:
          type: boolean
        topic:
          type: string
        message_type:
          type: string
        publisher_count:
          type: integer
        age_sec:
          type: number
          description: 最后一条消息年龄；从未收到为 -1
        rate_hz:
          type: number
          description: 最近窗口实测频率；样本不足为 -1
        expected_rate_hz:
          type: number
        detail:
          type: string
        metrics:
          type: object
          additionalProperties: true

    RosHealthSafety:
      type: object
      properties:
        available:
          type: boolean
        age_sec:
          type: number
        emergency_stop:
          type: boolean
        reason:
          type: string
        data_ok:
          type: boolean
          nullable: true
        localization_ok:
          type: boolean
          nullable: true
        battery_ok:
          type: boolean
          nullable: true
        battery_percent:
          type: number
        min_obstacle_distance:
          type: number

    RosHealthRuntime:
      type: object
      properties:
        ok:
          type: boolean
        checked:
          type: boolean
        node_count:
          type: integer
        expected_nodes:
          type: array
          items:
            type: string
        missing_nodes:
          type: array
          items:
            type: string
        use_sim_time:
          type: boolean
        error:
          type: string

    RosHealthHttp:
      type: object
      properties:
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
        configured_port:
          type: integer
        bound:
          type: boolean
        error:
          type: string
        auth:
          type: boolean

    RosHealth:
      type: object
      required:
        - ok
        - status
        - healthy
        - ready
        - service
        - version
        - uptime_sec
        - timestamp
        - reason
        - summary
        - emergency_stop
        - safety
        - ros
        - http
        - devices
        - request_id
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok, starting, degraded, error, disabled]
        healthy:
          type: boolean
        ready:
          type: boolean
        service:
          type: string
          example: "rush-mog-ros-health"
        version:
          type: string
          example: "0.2.0"
        uptime_sec:
          type: number
        timestamp:
          type: string
          format: date-time
        reason:
          type: string
        summary:
          $ref: '#/components/schemas/RosHealthSummary'
        emergency_stop:
          type: boolean
        safety:
          $ref: '#/components/schemas/RosHealthSafety'
        ros:
          $ref: '#/components/schemas/RosHealthRuntime'
        http:
          $ref: '#/components/schemas/RosHealthHttp'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/RosDeviceHealth'
        request_id:
          type: string

    RosHealthLive:
      type: object
      required: [ok, status, service, version, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        uptime_sec:
          type: number
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        request_id:
          type: string

    RosHealthReady:
      type: object
      required: [ok, status, reason, request_id]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        reason:
          type: string
        status_detail:
          type: string
          description: 整体健康状态 ok/starting/degraded/error/disabled
        request_id:
          type: string

    RosHealthDeviceEnvelope:
      type: object
      required: [ok, status, device, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          description: 整体状态（不是单设备状态）
        device:
          $ref: '#/components/schemas/RosDeviceHealth'
        request_id:
          type: string

    BodyControlUartCommand:
      type: string
      description: |
        ASCII 命令，不含结尾 `\n`。格式：`<command_id>[<second_byte>]`。
        第二字节语义见 `x-body-control-uart.second_byte`。
      pattern: '^[0-9A-PZ][0-9]?$'
      example: "15"
