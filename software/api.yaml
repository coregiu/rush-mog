        完整的帧格式、命令表、PWM/曲目第二字节语义见
        `x-body-control-uart`。

        固件不在 USART3 上返回 ACK 或遥测；发送成功仅表示字节已写入
        UART，不能证明 STM32 已接收/执行。
      operationId: bodyControlUartCommand
      deprecated: true
      servers:
        - url: "uart://stm32-usart3"
          description: 虚拟 UART 端点（非 HTTP，仅归档）
      x-transport: uart
      x-not-http: true
      x-try-it-out: false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/BodyControlUartCommand'
            examples:
              forward:
                summary: 前进
                value: "1"
              forward_pwm5:
                summary: 前进 + PWM 档 5
                value: "15"
              stop:
                summary: 停止
                value: "0"
              reset:
                summary: 复位
                value: "J"
              audio_play_track2:
                summary: 播放曲目 2
                value: "P2"
      responses:
        '200':
          description: |
            仅文档占位：UART 为 fire-and-forget，没有 HTTP 响应。
            真实链路不返回 ACK/响应体。
          content:
            text/plain:
              schema:
                type: string
              example: "no HTTP response; fire-and-forget UART"

components:
  securitySchemes:
    centerBearer:
      type: http
      scheme: bearer
      description: "Center Server 可选的 Bearer Token（server.api_key）"
    centerApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Center Server 可选的 API Key（server.api_key）"
    edgeRosHealthBearer:
      type: http
      scheme: bearer
      description: "Edge Server 内置 ROS 健康网关可选的 Bearer Token（health.http.api_key）"
    edgeRosHealthApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Edge Server 内置 ROS 健康网关可选的 API Key（health.http.api_key）"

  responses:
    CenterBadRequest:
      description: 请求格式错误（JSON/图像/base64/长度）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          examples:
            invalid_json:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "invalid_json"
                  message: "JSON 解析失败: ..."
    CenterUnauthorized:
      description: 缺少或错误的 API Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "unauthorized"
              message: "无效或缺失的 API Key"
    RosHealthUnauthorized:
      description: 缺少或错误的 ROS Health API Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "unauthorized"
              message: "无效或缺失的 API Key"
    CenterPayloadTooLarge:
      description: 请求体/图像超限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "payload_too_large"
              message: "请求体超过 16777216 字节"
    CenterUnsupportedMediaType:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "unsupported_media_type"
              message: "Content-Type 必须是 application/json"
    CenterUnprocessableEntity:
      description: 请求语义错误（instruction/图像/state/chunk/相机名等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          examples:
            missing_instruction:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "instruction_required"
                  message: "instruction 不能为空；SmolVLA 需要语言指令"
            missing_image:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "missing_image"
                  message: "缺少图像输入"
            unknown_image:
              value:
                ok: false
                request_id: "..."
                error:
                  code: "unknown_image_key"
                  message: "未知相机名: rear"
                  details:
                    allowed: ["camera1", "camera2", "camera3"]
    CenterInferenceError:
      description: 模型推理内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "inference_error"
              message: "SmolVLA 推理失败: ..."
    CenterModelUnavailable:
      description: torch/lerobot/权重/预处理器不可用，或模型加载失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CenterErrorResponse'
          example:
            ok: false
            request_id: "..."
            error:
              code: "model_unavailable"
              message: "未安装 PyTorch，无法加载 SmolVLA"
              details:
                install: "pip install -r requirements-vla.txt"

  schemas:
    EdgeStatus:
      type: object
      description: Pi Edge Server 运行状态（不含 STM32 底盘遥测）
      required:
        - uptime_ms
        - free_heap
        - free_psram
        - camera
        - sdcard
        - motion_active
      properties:
        uptime_ms:
          type: integer
          format: int64
          description: Edge Server 启动后的毫秒数
        free_heap:
          type: integer
          format: int64
          description: 当前可用系统内存（bytes；Pi 兼容字段名）
        free_psram:
          type: integer
          format: int64
          description: Pi 无 PSRAM，固定为 0（兼容字段）
        camera:
          type: integer
          enum: [0, 1]
          description: 最近 2s 内是否收到相机帧/生成 MJPEG
        sdcard:
          type: integer
          enum: [0, 1]
          description: Edge 配置的 /sdcard 映射目录是否存在
        motion_active:
          type: integer
          enum: [0, 1]
          description: 是否正在持续重发运动命令
        serial_connected:
          type: boolean
          description: STM32 UART 是否已连接
        encoder_ok:
          type: boolean
          description: 最近 2s 内是否收到有效 `$B,...` 遥测
        ros_status:
          type: string
          description: 同机 ROS 健康网关状态（ok/degraded/...）
        ros_ready:
          type: boolean
          description: 同机 ROS 是否 ready
        ip:
          type: string
          description: Edge Server 当前 IP
        hostname:
          type: string
          description: 主机名

    EdgePowerStatus:
      type: object
      description: 树莓派电源监控（vcgencmd throttled + rpi_volt）
      required: [ok, enabled, available, status, healthy]
      properties:
        ok: {type: boolean, enum: [true]}
        enabled: {type: boolean}
        available: {type: boolean}
        online: {type: boolean}
        source: {type: string, example: rpi}
        model: {type: string, example: "Raspberry Pi 4 Model B Rev 1.4"}
        status:
          type: string
          enum: [ok, degraded, error, disabled, unknown]
        healthy: {type: boolean}
        undervoltage: {type: boolean}
        undervoltage_occurred: {type: boolean}
        frequency_capped: {type: boolean}
        throttled: {type: boolean}
        soft_temp_limit: {type: boolean}
        throttled_occurred: {type: boolean}
        throttled_raw: {type: string, example: "0x50000"}
        warning: {type: boolean}
        warnings:
          type: array
          items: {type: string}
        core_voltage_v: {type: number, nullable: true, example: 0.85}
        temperature_c: {type: number, nullable: true, example: 39.4}
        alarm: {type: integer}
        error: {type: string}
        checked_ms: {type: integer, format: int64}
        age_ms: {type: integer}

    EdgeMicrophoneStatus:
      type: object
      description: newmine 蓝牙 HFP 麦克风状态
      required: [ok, enabled, available, recording]
      properties:
        ok: {type: boolean, enum: [true]}
        enabled: {type: boolean}
        supported: {type: boolean}
        available: {type: boolean}
        online: {type: boolean}
        recording: {type: boolean}
        source: {type: string, example: "bluez_input.73_DB_39_F2_15_4B.headset-head-unit"}
        sample_rate: {type: integer, example: 8000}
        channels: {type: integer, example: 1}
        chunk_ms: {type: integer, example: 100}
        duration_ms: {type: integer}
        started_ms: {type: integer, format: int64}
        file: {type: string}
        file_name: {type: string}
        last_file: {type: string}
        last_file_name: {type: string}
        last_duration_ms: {type: integer}
        bytes: {type: integer}
        volume: {type: integer, minimum: 0, maximum: 100}
        gain: {type: number, minimum: 1.0, maximum: 8.0}
        max_duration_sec: {type: number}
        record_dir: {type: string}
        topic: {type: string, example: "/edge/audio"}
        status_topic: {type: string, example: "/body/mic_status"}
        error: {type: string}

    EdgeSpeakerStatus:
      type: object
      description: newmine 蓝牙音箱 + TTS 播放状态
      required: [ok, enabled, state, connected, audio_ready]
      properties:
        ok:
          type: boolean
          enum: [true]
        enabled:
          type: boolean
        state:
          type: string
          enum: [disabled, starting, scanning, connecting, connected, disconnected, error]
        status:
          type: string
          enum: [ok, degraded, starting, error, disabled, unknown]
        connected:
          type: boolean
        audio_ready:
          type: boolean
        online:
          type: boolean
          description: 已连接且音频输出就绪；health monitor 用该字段判断音箱是否在线
        device:
          type: object
          properties:
            name: {type: string, example: newmine}
            mac: {type: string, example: "73:DB:39:F2:15:4B"}
            paired: {type: boolean}
            trusted: {type: boolean}
        sink:
          type: object
          properties:
            name: {type: string, example: "bluez_output.73_DB_39_F2_15_4B.1"}
            id: {type: integer}
            ready: {type: boolean}
            volume: {type: integer, minimum: 0, maximum: 100}
        tts:
          type: object
          properties:
            backend: {type: string, example: espeak-ng}
            voice: {type: string, example: cmn}
            speed: {type: integer}
            pre_roll_ms: {type: integer, example: 450}
            playback_latency_ms: {type: integer, example: 250}
        playback:
          type: object
          properties:
            playing: {type: boolean}
            queue: {type: integer}
            last_text: {type: string}
            last_error: {type: string}
            last_played_ms: {type: integer, format: int64}
        last_error:
          type: string
        last_connected_ms:
          type: integer
          format: int64
        updated_ms:
          type: integer
          format: int64

    EdgeModuleReport:
      type: object
      description: CENTER 等外部模块通过 `POST /api/modules/report` 提交的表单（`ros` 为本地保留）
      required: [module, status]
      properties:
        module:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,16}$'
          example: "center"
        name:
          type: string
          maxLength: 48
        version:
          type: string
          maxLength: 24
        status:
          type: string
          enum: [ok, starting, degraded, error, unknown, offline, disabled]
        summary:
          type: string
          maxLength: 240
        health_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8090
        health_path:
          type: string
          maxLength: 80
          default: "/ros/health"
        params_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8090
        params_path:
          type: string
          maxLength: 80
          default: "/ros/params"
        params_json:
          type: string
          maxLength: 2048
          description: 精简参数 JSON 字符串；Edge Server 原样缓存

    EdgeModule:
      type: object
      required: [id, name, status, updated_ms, stale]
      properties:
        id:
          type: string
          example: "center"
        name:
          type: string
        version:
          type: string
        ip:
          type: string
          example: "192.168.4.2"
        status:
          type: string
          enum: [ok, starting, degraded, error, unknown, offline, disabled]
        summary:
          type: string
        health_url:
          type: string
        params_url:
          type: string
        updated_ms:
          type: integer
          format: int64
        age_ms:
          type: integer
          format: int64
        stale:
          type: boolean
        params:
          type: object
          additionalProperties: true

    EdgeModulesResponse:
      type: object
      required: [ok, edge, modules, count]
      properties:
        ok:
          type: boolean
          enum: [true]
        server_time_ms:
          type: integer
          format: int64
        edge:
          $ref: '#/components/schemas/EdgeModule'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/EdgeModule'
        count:
          type: integer

    ModuleParam:
      type: object
      required: [key, label, value, type, group, editable]
      properties:
        key:
          type: string
        label:
          type: string
        value:
          nullable: true
          description: 当前值；数字/布尔/字符串
        type:
          type: string
          enum: [int, float, bool, string, enum]
        group:
          type: string
        unit:
          type: string
        min:
          type: number
        max:
          type: number
        step:
          type: number
        options:
          type: array
          items:
            type: string
        editable:
          type: boolean
        requires_restart:
          type: boolean
        help:
          type: string

    ModuleParams:
      type: object
      required: [ok, module, params]
      properties:
        ok:
          type: boolean
          enum: [true]
        module:
          type: string
        name:
          type: string
        version:
          type: string
        editable:
          type: boolean
        requires_restart:
          type: boolean
        params:
          type: array
          items:
            $ref: '#/components/schemas/ModuleParam'

    ModuleParamsUpdate:
      type: object
      required: [updates]
      properties:
        updates:
          type: object
          additionalProperties: true

    ModuleParamsUpdateResponse:
      type: object
      required: [ok, updated]
      properties:
        ok:
          type: boolean
          enum: [true]
        updated:
          type: object
          additionalProperties: true
        requires_restart:
          type: boolean
        message:
          type: string

    EdgeButtonMessage:
      type: string
      description: |
        按钮消息：`button:<key>:<type>`。
        `stop` 键无论 type 如何都映射到停止命令。
      pattern: '^button:(up|down|left|right|triangle|cross|square|circle|l1|r1|l2|r2|start|select|stop):(down|up|stop)$'
      maxLength: 32
      example: "button:up:down"

    EdgeStickMessage:
      type: string
      description: |
        摇杆消息：`stick:left-analog:<direct>:<stepValue>`。
        `direct=stop` 或 `stepValue=0` 等价停止。
      pattern: '^stick:left-analog:(stop|up|down|left|right|uple|uprt|dnle|dnrt):[0-9]$'
      maxLength: 32
      example: "stick:left-analog:up:5"

    EdgeControlMessage:
      description: 纯文本控制消息；两条命令族二选一
      oneOf:
        - $ref: '#/components/schemas/EdgeButtonMessage'
        - $ref: '#/components/schemas/EdgeStickMessage'

    CenterImagePayload:
      type: object
      description: |
        图像对象。可直接传 base64/data URI 字符串，也可用对象形式。
        `data`、`base64`、`image` 三选一；`format` 仅为兼容字段，服务端按
        实际图像内容解码。
      properties:
        data:
          type: string
          description: base64 或 `data:image/...;base64,...`
        base64:
          type: string
          description: "`data` 的别名"
        image:
          type: string
          description: "`data` 的别名"
        format:
          type: string
          description: 可选的格式提示（png/jpeg），当前不强制使用
      anyOf:
        - type: object
          properties:
            data:
              type: string
          required: [data]
        - type: object
          properties:
            base64:
              type: string
          required: [base64]
        - type: object
          properties:
            image:
              type: string
          required: [image]

    CenterInferOptions:
      type: object
      properties:
        chunk_size:
          type: integer
          minimum: 1
          maximum: 1000
          description: 只返回动作块前 N 步；默认返回完整 chunk
        return_mapped:
          type: boolean
          default: false
          description: 为 true 时额外返回每一步的映射结果 `mapped_actions`

    CenterInferRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          maxLength: 512
          description: 语言指令；也接受别名 `task`/`language_instruction`
        images:
          type: object
          maxProperties: 8
          description: |
            `{相机名: base64 | data URI | CenterImagePayload}`。
            相机名可用 `model.image_aliases` 映射到 checkpoint 相机键；
            缺失相机按 `model.missing_image_policy` 处理。
          additionalProperties:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/CenterImagePayload'
        state:
          type: array
          items:
            type: number
          description: 本体状态向量；不足补零，超出截断，顺序需与训练数据一致
        task_id:
          type: string
          maxLength: 128
          description: 回显；为空时使用 request_id
        session_id:
          type: string
          maxLength: 128
          description: 回显；当前无跨请求会话状态
        reset:
          type: boolean
          default: false
          description: 为 true 时先调用 policy.reset()
        options:
          $ref: '#/components/schemas/CenterInferOptions'

    CenterVector3:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number

    CenterBaseCmd:
      type: object
      description: 与 ROS geometry_msgs/Twist 对应的速度命令
      properties:
        linear:
          $ref: '#/components/schemas/CenterVector3'
        angular:
          $ref: '#/components/schemas/CenterVector3'

    CenterMappedAction:
      type: object
      properties:
        mode:
          type: string
          enum: [raw, base_twist, hybrid, joint]
          description: 动作解释模式
        raw:
          type: array
          items:
            type: number
          description: 该步模型原始动作
        base_cmd:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CenterBaseCmd'
        arm_cmd:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: 关节名 -> 角度/位置；raw/base_twist 模式为 null
        clipped:
          type: boolean
          description: 是否发生速度/关节限幅

    CenterModelRef:
      type: object
      properties:
        backend:
          type: string
          enum: [smolvla, stub]
        path:
          type: string
          description: HF 仓库名或本地 checkpoint 目录
        device:
          type: string
          example: "cuda"
        dtype:
          type: string
          example: "float16"

    CenterModelInfo:
      type: object
      description: 模型/动作 schema 与加载状态
      properties:
        backend:
          type: string
          enum: [smolvla, stub]
        path:
          type: string
        loaded:
          type: boolean
        loading:
          type: boolean
        device:
          type: string
        dtype:
          type: string
        action_dim:
          type: integer
          nullable: true
        state_dim:
          type: integer
        chunk_size:
          type: integer
        image_keys:
          type: array
          items:
            type: string
        processors:
          type: boolean
          description: 是否成功构建 LeRobot 预处理器/后处理器
        error:
          type: string
          nullable: true
          description: 最近一次加载失败摘要
        configured_image_keys:
          type: array
          items:
            type: string
        image_aliases:
          type: object
          additionalProperties:
            type: string
        action_mode:
          type: string
          enum: [raw, base_twist, hybrid, joint]

    CenterInferResponse:
      type: object
      required:
        - ok
        - request_id
        - actions
        - action
        - action_dim
        - chunk_size
        - latency_ms
        - timestamp
      properties:
        ok:
          type: boolean
          enum: [true]
        request_id:
          type: string
        task_id:
          type: string
        session_id:
          type: string
        instruction:
          type: string
        actions:
          type: array
          minItems: 1
          description: 动作块，每个元素是一步动作
          items:
            type: array
            items:
              type: number
        action:
          type: array
          items:
            type: number
          description: 动作块第一步
        action_dim:
          type: integer
        chunk_size:
          type: integer
        base_cmd:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CenterBaseCmd'
        arm_cmd:
          type: object
          nullable: true
          additionalProperties:
            type: number
        mapped:
          $ref: '#/components/schemas/CenterMappedAction'
        mapped_actions:
          type: array
          description: 仅 options.return_mapped=true 时返回
          items:
            $ref: '#/components/schemas/CenterMappedAction'
        model:
          $ref: '#/components/schemas/CenterModelRef'
        latency_ms:
          type: number
          description: 服务端总耗时
        model_latency_ms:
          type: number
          description: 模型调用耗时
        timestamp:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string

    CenterHealth:
      type: object
      required: [ok, status, ready, service, version, uptime_sec, model, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
        service:
          type: string
          example: "rush-mog-center-server"
        version:
          type: string
          example: "0.1.0"
        uptime_sec:
          type: number
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        request_id:
          type: string

    CenterReady:
      type: object
      required: [ok, status, model, request_id]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        request_id:
          type: string

    CenterLive:
      type: object
      required: [ok, status, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok]
        request_id:
          type: string

    CenterModelEnvelope:
      type: object
      required: [ok, model, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        request_id:
          type: string

    CenterResetRequest:
      type: object
      properties:
        session_id:
          type: string
          maxLength: 128

    CenterResetResponse:
      type: object
      required: [ok, session_id, message, timestamp, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        session_id:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    CenterWarmupResponse:
      type: object
      required: [ok, latency_ms, model_latency_ms, model, timestamp, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        latency_ms:
          type: number
        model_latency_ms:
          type: number
        model:
          $ref: '#/components/schemas/CenterModelInfo'
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string

    CenterError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          example: "model_unavailable"
        message:
          type: string
          description: 人类可读错误信息
        details:
          type: object
          additionalProperties: true
          description: 可选的上下文信息

    CenterErrorResponse:
      type: object
      required: [ok, error, request_id]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/CenterError'
        request_id:
          type: string

    RosHealthSummary:
      type: object
      required: [total, enabled, ok, degraded, error, unknown, disabled]
      properties:
        total:
          type: integer
        enabled:
          type: integer
        ok:
          type: integer
        degraded:
          type: integer
        error:
          type: integer
        unknown:
          type: integer
        disabled:
          type: integer

    RosDeviceHealth:
      type: object
      required:
        - id
        - type
        - status
        - healthy
        - ready
        - enabled
        - required
        - connected
        - data_fresh
        - topic
        - message_type
        - publisher_count
        - age_sec
        - rate_hz
        - expected_rate_hz
        - detail
      properties:
        id:
          type: string
          example: "camera"
        type:
          type: string
          enum: [camera, lidar, imu, microphone, speaker, arm, base, battery, power, odometry, other]
        status:
          type: string
          enum: [ok, degraded, error, unknown, disabled]
        healthy:
          type: boolean
        ready:
          type: boolean
        enabled:
          type: boolean
        required:
          type: boolean
        connected:
          type: boolean
        data_fresh:
          type: boolean
        topic:
          type: string
        message_type:
          type: string
        publisher_count:
          type: integer
        age_sec:
          type: number
          description: 最后一条消息年龄；从未收到为 -1
        rate_hz:
          type: number
          description: 最近窗口实测频率；样本不足为 -1
        expected_rate_hz:
          type: number
        detail:
          type: string
        metrics:
          type: object
          additionalProperties: true

    RosHealthSafety:
      type: object
      properties:
        available:
          type: boolean
        age_sec:
          type: number
        emergency_stop:
          type: boolean
        reason:
          type: string
        data_ok:
          type: boolean
          nullable: true
        localization_ok:
          type: boolean
          nullable: true
        battery_ok:
          type: boolean
          nullable: true
        battery_percent:
          type: number
        min_obstacle_distance:
          type: number

    RosHealthRuntime:
      type: object
      properties:
        ok:
          type: boolean
        checked:
          type: boolean
        node_count:
          type: integer
        expected_nodes:
          type: array
          items:
            type: string
        missing_nodes:
          type: array
          items:
            type: string
        use_sim_time:
          type: boolean
        error:
          type: string

    RosHealthHttp:
      type: object
      properties:
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
        configured_port:
          type: integer
        bound:
          type: boolean
        error:
          type: string
        auth:
          type: boolean

    RosHealth:
      type: object
      required:
        - ok
        - status
        - healthy
        - ready
        - service
        - version
        - uptime_sec
        - timestamp
        - reason
        - summary
        - emergency_stop
        - safety
        - ros
        - http
        - devices
        - request_id
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok, starting, degraded, error, disabled]
        healthy:
          type: boolean
        ready:
          type: boolean
        service:
          type: string
          example: "rush-mog-ros-health"
        version:
          type: string
          example: "0.2.0"
        uptime_sec:
          type: number
        timestamp:
          type: string
          format: date-time
        reason:
          type: string
        summary:
          $ref: '#/components/schemas/RosHealthSummary'
        emergency_stop:
          type: boolean
        safety:
          $ref: '#/components/schemas/RosHealthSafety'
        ros:
          $ref: '#/components/schemas/RosHealthRuntime'
        http:
          $ref: '#/components/schemas/RosHealthHttp'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/RosDeviceHealth'
        request_id:
          type: string

    RosHealthLive:
      type: object
      required: [ok, status, service, version, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        uptime_sec:
          type: number
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        request_id:
          type: string

    RosHealthReady:
      type: object
      required: [ok, status, reason, request_id]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        reason:
          type: string
        status_detail:
          type: string
          description: 整体健康状态 ok/starting/degraded/error/disabled
        request_id:
          type: string

    RosHealthDeviceEnvelope:
      type: object
      required: [ok, status, device, request_id]
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          description: 整体状态（不是单设备状态）
        device:
          $ref: '#/components/schemas/RosDeviceHealth'
        request_id:
          type: string

    BodyControlUartCommand:
      type: string
      description: |
        ASCII 命令，不含结尾 `\n`。格式：`<command_id>[<second_byte>]`。
        第二字节语义见 `x-body-control-uart.second_byte`。
      pattern: '^[0-9A-PZ][0-9]?$'
      example: "15"
