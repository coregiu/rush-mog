openapi: 3.0.3

info:
  title: Rush-MOG 模块接口
  version: 1.3.1
  description: |
    Rush-MOG 各模块接口归档，按模块分组：

    | 模块 | 传输 | 入口 | 说明 |
    | --- | --- | --- | --- |
    | **Edge Server** | HTTP | `http://192.168.4.1`（80） | 树莓派 Edge Server：网页手柄、数字孪生、模块上报/代理、静态资源、MJPEG 图传、STM32 串口桥；内置 ROS 健康网关（`:8090`） |
    | **Center Server** | HTTP | `http://127.0.0.1:8000` | SmolVLA 多模态推理、健康检查、模型/参数信息 |
    | **Body Control** | UART | STM32 USART3，115200 8N1 | 树莓派 Edge Server → STM32 的 ASCII 运动/音频命令，无 ACK |

    > **ROS 说明**：`software/edge_server` 的 ROS 2 话题/服务/Action 不是 HTTP，
    > 未纳入本 OpenAPI 文件，详见 `software/edge_server/README.md`。
    > ROS 健康网关已并入 Edge Server：`health_monitor_node` 默认在
    > `127.0.0.1:8090` 提供 `/ros/*` 接口，80 端口通过
    > `/api/modules/ros/health|params` 代理；完整契约见
    > `software/edge_server/HEALTHCHECK.md`。
    >
    > **UART 说明**：OpenAPI/Swagger 只原生描述 HTTP。本文档用
    > `/body-control/uart/command` 作为**虚拟归档路径**，并在
    > `x-body-control-uart` 中给出完整 UART 帧格式、命令表和 ACK 行为。
    > 该路径不是 HTTP 端点，请勿用 Swagger “Try it out” 调用。

    详细文档：
    - Edge Server：`software/edge_server/README.md`（`edge_server_node`）
    - Center Server：`software/center_server/README.md`、`DESIGN.md`
    - ROS 健康网关（Edge Server 内置）：`software/edge_server/HEALTHCHECK.md`
    - Body Control：`software/body_control/README.md`

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "http://192.168.4.1"
    description: Pi Edge Server（树莓派 AP，HTTP 80）

# Edge/UART/健康检查默认匿名；Center 受保护端点在各 operation 上覆盖为可选鉴权
security: []

tags:
  - name: Edge Server
    description: |
      树莓派 4B/5 车载上位机（Edge Server 与 ROS 2 同机）。手机/PC 连接
      `RUSH-MOG` Wi-Fi（树莓派 hostapd）后访问 `http://192.168.4.1`。
      80 端口负责网页/静态文件/控制/状态/模块监控 API，8080 端口负责
      ROS 相机 MJPEG 图传；控制命令通过 Pi UART 直接发给 STM32。

      数字孪生页面：`GET /dashboard.html`（手柄页点 RUSH-MOG TWIN）。
      ROS 2 在同机由 `edge_server_node` 直接采集；CENTER 通过
      `/api/modules/report` 上报，页面通过 `/api/modules/{id}/health|params`
      由 Edge Server 代理访问模块。`ros` 是本地保留子系统 ID，不允许外部上报。

      内置 ROS 健康网关：`health_monitor_node` 默认监听 `127.0.0.1:8090`，
      提供 `/ros/health`、`/ros/health/devices/{id}`、`/ros/params`、
      `/ros/healthz`、`/ros/readyz`；80 端口通过
      `/api/modules/ros/health|params` 代理。完整契约见
      `software/edge_server/HEALTHCHECK.md`。
    x-docs: "./edge_server/README.md"
  - name: Center Server
    description: |
      独立部署的 SmolVLA 中心推理服务，默认监听 `0.0.0.0:8000`。
      车载 ROS 通过 `POST /v1/infer` 发送语言指令/图像/本体状态，
      服务返回动作块及第一步映射后的底盘/机械臂命令。
      本服务不直接控制 STM32。

      中心服务的 `GET /` 服务信息因与 Edge Server 的 `GET /` 冲突，
      不单独占用 path，见 `x-center-server.root_response`；CORS 见
      `x-center-server.cors`。
    x-docs: "./center_server/README.md"
  - name: Body Control (UART)
    description: |
      STM32F103C8T6 车体控制器的 UART 命令协议。树莓派 Edge Server 的
      UART（`/dev/rush_base` 或 `/dev/ttyUSB0`）连接 STM32 USART3
      （PB10 TX / PB11 RX），115200 8N1，命令以 `\n` 结束。命令无 ACK；
      USART3 会周期回传 `$B,...` 编码器遥测，Edge Server 通过 `/api/body` 暴露。
    x-docs: "./body_control/README.md"

x-tagGroups:
  - name: 车载控制
    tags:
      - Edge Server
      - Body Control (UART)
  - name: 中心推理
    tags:
      - Center Server

