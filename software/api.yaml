paths:
  /:
    get:
      tags: [Edge Server]
      summary: PS2 手柄网页入口
      description: |
        `GET /` 由 `handleWebRequest()` 映射到 LittleFS 的 `/index.html`。
        页面包含虚拟 PS2 手柄、摄像头画面、语音控制和 YOLO 开关。
        `index.html` 使用 `Cache-Control: no-cache`。
      operationId: edgeIndex
      responses:
        '200':
          description: PS2 手柄页面
          content:
            text/html:
              schema:
                type: string
        '404':
          description: LittleFS 中没有 index.html
          content:
            text/plain:
              schema:
                type: string
              example: "File Not Found - index.html!"
        '500':
          description: 文件打开失败
          content:
            text/plain:
              schema:
                type: string
              example: "Failed to open file"

  /{asset}:
    get:
      tags: [Edge Server]
      summary: LittleFS 静态资源
      description: |
        返回 LittleFS 中的静态文件，Content-Type 按扩展名推断：
        `.html`、`.css`、`.js`、`.json`、`.png`、`.jpg/.jpeg`、`.svg`、
        `.ico`、`.wasm`、`.woff2`、`.bin`。
        路径包含 `..` 时返回 400。未知文件返回 404。
      operationId: edgeGetAsset
      parameters:
        - name: asset
          in: path
          required: true
          description: 已知资源名；也支持 LittleFS 中上传的其它单段文件名。
          schema:
            type: string
            enum:
              - index.html
              - dashboard.html
              - dashboard.css
              - dashboard.js
              - ps2.css
              - ps2.js
              - audio.js
              - yolo.js
              - unimog.jpeg
              - favicon.ico
      responses:
        '200':
          description: 静态文件
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: 路径包含非法字符
          content:
            text/plain:
              schema:
                type: string
              example: "Bad Request"
        '404':
          description: 文件不存在
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 文件打开失败
          content:
            text/plain:
              schema:
                type: string

  /sdcard/{path}:
    get:
      tags: [Edge Server]
      summary: SD 卡静态资源（YOLO 模型/依赖）
      description: |
        从 SD 卡读取文件，例如：
        - `/sdcard/tf.min.js`
        - `/sdcard/coco-ssd.js`
        - `/sdcard/models/coco-ssd/model.json`
        - `/sdcard/models/coco-ssd/group1-shard1of1.bin`

        `path` 是相对 SD 卡根目录的路径，允许包含 `/`；实际请求 URL 中
        需要保留路径分隔符。SD 卡未挂载时返回 503。
      operationId: edgeGetSdcardAsset
      parameters:
        - name: path
          in: path
          required: true
          description: 相对 SD 卡根目录的文件路径，可包含子目录。
          schema:
            type: string
          example: "models/coco-ssd/model.json"
      responses:
        '200':
          description: 文件内容
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: 路径为空或包含 `..`
          content:
            text/plain:
              schema:
                type: string
              example: "Bad Request"
        '404':
          description: 文件不存在
          content:
            text/plain:
              schema:
                type: string
              example: "Sdcard Not Found The File"
        '500':
          description: 文件打开失败
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: SD 卡未挂载
          content:
            text/plain:
              schema:
                type: string
              example: "SD card not mounted"

  /stream:
    get:
      tags: [Edge Server]
      summary: MJPEG 图传（8080）；80 端口返回 302
      description: |
        **8080 端口** `/stream` 返回 `multipart/x-mixed-replace` MJPEG 流，
        每帧 JPEG，boundary 为 `frame`。新连接会关闭旧连接，避免抢帧。

        **80 端口** `/stream` 仅做兼容重定向：
        `302 Location: http://<AP_IP>:8080/stream`。
        页面实际使用 `http://<host>:8080/stream`。
      operationId: edgeMjpegStream
      servers:
        - url: "http://192.168.4.1:8080"
          description: Edge Server MJPEG 端口
      responses:
        '200':
          description: 持续 MJPEG 流
          headers:
            Cache-Control:
              schema:
                type: string
              example: "no-cache, no-store, must-revalidate"
            Pragma:
              schema:
                type: string
              example: "no-cache"
            Connection:
              schema:
                type: string
              example: "close"
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '302':
          description: 仅 80 端口；重定向到 8080 的 `/stream`
          headers:
            Location:
              schema:
                type: string
              example: "http://192.168.4.1:8080/stream"
          content:
            text/plain:
              schema:
                type: string
                example: ""
        '503':
          description: 摄像头未就绪（8080）
          content:
            text/plain:
              schema:
                type: string
                example: ""

  /cmd:
    post:
      tags: [Edge Server]
      summary: 统一控制命令入口（纯文本）
      description: |
        请求体是一条纯文本控制消息，最大 32 字符；支持：

        - `button:<key>:<type>`
        - `stick:left-analog:<direct>:<stepValue>`
        - `raw:<command>`：ROS2 专用 Body Control 运动命令，只允许
          `0`、`1`~`9`、`A`~`C`，可带第二字节 PWM `0`~`9`。
          Edge Server 保留第二字节并每 200ms 重发；1s 未收到新 raw 命令自动停车。

        示例：`button:up:down`、`button:stop:down`、
        `stick:left-analog:up:5`、`raw:15`、`raw:95`。

        也兼容 `curl -d` 的 `application/x-www-form-urlencoded`：
        当 `plain` 参数为空且存在参数时，使用第一个参数名作为命令。
        无法识别的消息前缀会被忽略，但仍返回 200。

        按键/摇杆到 UART 命令的完整映射见 `x-edge-command-mapping`。
        持续运动命令由 Edge Server 默认每 200ms 重发给 STM32（可配 100–600ms），直到收到停止/松开；
        网页手动控制优先于 ROS `/cmd_vel`，直到松开/停止。
      operationId: edgeCmd
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/EdgeControlMessage'
            examples:
              forward:
                summary: 前进按下
                value: "button:up:down"
              stop:
                summary: 停止
                value: "button:stop:down"
              stick:
                summary: 左摇杆向前，速度档 5
                value: "stick:left-analog:up:5"
              ros_forward:
                summary: ROS 前进，PWM 档 5
                value: "raw:15"
              ros_turn:
                summary: ROS 左转，PWM 档 5
                value: "raw:95"
          application/x-www-form-urlencoded:
            schema:
              type: string
              description: 兼容 curl -d；整个请求体被解析为第一个参数名。
            example: "button:up:down"
      responses:
        '200':
          description: 命令已接收（即使前缀无法识别；不代表 STM32 已执行）
          content:
            text/plain:
              schema:
                type: string
              example: "ok"
        '400':
          description: 空命令或命令超过 32 字符
          content:
            text/plain:
              schema:
                type: string
              examples:
                empty:
                  value: "empty command"
                too_long:
                  value: "command too long"

  /cmd-button:
    get:
      tags: [Edge Server]
      summary: 按钮命令（查询参数形式）
      description: |
        旧页面使用的按钮接口；与 `POST /cmd` 的 `button:` 消息共用
        `edge_control.button_command()`。Pi Edge Server 同时接受 GET 查询参数
        和 POST 表单，GET 是旧页面实际使用的方法。

        有效 key：up/down/left/right/triangle/cross/square/circle/
        l1/r1/l2/r2/start/select/stop。type 为 down/up（`stop` 为兼容写法）。
        未知 key/type 会被忽略，但仍返回 200。
      operationId: edgeCmdButton
      deprecated: true
      parameters:
        - name: key
          in: query
          required: true
          description: 按钮名称
          schema:
            type: string
            enum:
              - up
              - down
              - left
              - right
              - triangle
              - cross
              - square
              - circle
              - l1
              - r1
              - l2
              - r2
              - start
              - select
              - stop
        - name: type
          in: query
          required: true
          description: 按下/松开；`stop` 仅作为 `stop` 键的兼容写法
          schema:
            type: string
            enum: [down, up, stop]
      responses:
        '200':
          description: 已处理（未知 key/type 也会返回 200）
        '400':
          description: 缺少 key 或 type
          content:
            text/plain:
              schema:
                type: string
              example: "400 Bad Request - Missing 'key' or 'type' parameter"

  /cmd-stick:
    get:
      tags: [Edge Server]
      summary: 左摇杆命令（查询参数形式）
      description: |
        旧页面使用的摇杆接口；与 `POST /cmd` 的 `stick:` 消息共用
        `processCmdStick()`。仅接受 `stickId=left-analog`；
        `stepValue` 必须是单个 0-9 数字。未知 stickId/direct 会静默忽略，
        但仍返回 200。direct=stop 或 stepValue=0 时发送停止命令。
      operationId: edgeCmdStick
      deprecated: true
      parameters:
        - name: stickId
          in: query
          required: true
          schema:
            type: string
            enum: [left-analog]
        - name: direct
          in: query
          required: true
          description: 摇杆方向；8 个斜向/直向 + stop
          schema:
            type: string
            enum:
              - stop
              - up
              - down
              - left
              - right
              - uple
              - uprt
              - dnle
              - dnrt
        - name: stepValue
          in: query
          required: true
          description: 速度/PWM 档位 0-9；0 等价停止
          schema:
            type: string
            pattern: '^[0-9]$'
      responses:
        '200':
          description: 已处理（未知方向也会返回 200）
        '400':
          description: 缺少 stickId/direct/stepValue
          content:
            text/plain:
              schema:
                type: string
              example: "400 Bad Request - Missing 'stickId', 'direct' or 'stepValue' parameter"

  /stop:
    get:
      tags: [Edge Server]
      summary: 显式停车
      description: |
        清除 Edge Server 的持续运动状态，并向 STM32 发送 `0`。
        页面 pagehide/断线兜底可调用；返回 `stopped`。
      operationId: edgeStop
      responses:
        '200':
          description: 已停车
          content:
            text/plain:
              schema:
                type: string
              example: "stopped"

  /status:
    get:
      tags: [Edge Server]
      summary: Pi Edge Server 运行状态
      description: |
        返回 Pi Edge Server 的 uptime、可用内存、串口/ROS/相机/SD 状态和当前
        是否有持续运动。**不包含 STM32 的编码器/IMU/电池等底盘遥测；底盘遥测见
        `GET /api/body`。**
      operationId: edgeStatus
      responses:
        '200':
          description: 状态 JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeStatus'
              example:
                uptime_ms: 123456
                free_heap: 734003200
                free_psram: 0
                camera: 1
                sdcard: 1
                motion_active: 0
                serial_connected: true
                encoder_ok: true
                ros_status: ok
                ros_ready: true
                speaker_connected: true
                speaker_state: connected
                speaker_device: newmine
                audio_playing: false
                mic_available: true
                mic_recording: false
                power_status: ok
                power_ok: true
                ip: "192.168.4.1"
                hostname: "rush-mog"

  /api/modules:
    get:
      tags: [Edge Server]
      summary: 模块注册表 + Edge 自身状态
      description: |
        dashboard.html 的主数据源。返回 Edge 自身状态/参数、同机 ROS 2 子系统快照，
        以及 CENTER 等外部模块最近一次通过 `POST /api/modules/report` 上报的缓存。
        外部模块超过 15 秒未上报时 `stale=true`；`ros` 由 Edge Server 本地生成。
      operationId: edgeModules
      responses:
        '200':
          description: 模块注册表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeModulesResponse'

  /api/body:
    get:
      tags: [Edge Server]
      summary: STM32 编码器遥测快照
      description: |
        Pi Edge Server 从 UART 解析 STM32 编码器遥测后缓存的最新帧。
        轮速单位 mm/s，distance_mm 为四轮平均绝对里程。
        `valid=false` 表示从未收到；`stale=true` 表示超过 2s 未更新。
        `cliff.available=false` 表示 STM32 固件尚未上报第 9 字段 cliff_mask。
      operationId: edgeBody
      responses:
        '200':
          description: 编码器遥测
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  body:
                    type: object
                    properties:
                      cliff:
                        type: object
                        properties:
                          available: {type: boolean}
                          mask: {type: integer}
                          left: {type: boolean}
                          right: {type: boolean}
                          triggered: {type: boolean}
                          state: {type: string}
                      valid: {type: boolean}
                      stale: {type: boolean}
                      source: {type: string, example: stm32}
                      rate_hz: {type: number, example: 10}
                      seq: {type: integer}
                      uptime_ms: {type: integer}
                      age_ms: {type: integer}
                      wheel_mm_s:
                        type: array
                        items: {type: integer}
                        minItems: 4
                        maxItems: 4
                      distance_mm: {type: integer}

  /api/speaker:
    get:
      tags: [Edge Server]
      summary: 蓝牙音箱与语音播报状态
      description: |
        返回 newmine 蓝牙音箱的连接状态、A2DP sink、音量、TTS 后端和播放队列。
        `status=ok` 表示已连接且音频输出就绪；`degraded` 表示已连接但 sink 未就绪；
        `starting` 表示搜索/连接中；`error` 表示最近一次连接失败（后台会继续重试）。
      operationId: edgeSpeakerStatus
      responses:
        '200':
          description: 音箱状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeSpeakerStatus'
        '503':
          description: 音箱功能未启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/speaker/{action}:
    post:
      tags: [Edge Server]
      summary: 音箱操作（连接/播报/播放/音量/停止）
      description: |
        - `connect`：立即触发一次蓝牙连接检查；
        - `say`：`{"text":"...","voice":"cmn"}`，走 TTS 后播放；也接受 text/plain；
        - `play`：`{"file":"prompt.wav"}`，文件必须位于 `edge.speaker.audio_dir`；
        - `volume`：`{"volume":70}`，0..100；
        - `stop`：清空队列并停止当前播放。
      operationId: edgeSpeakerAction
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [connect, say, play, volume, stop]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: 操作已接受（`speaker` 为最新状态）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 参数非法（空文本/音量越界/文件越界等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '404':
          description: 未知音箱动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '503':
          description: 音箱功能未启用或当前不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/microphone:
    get:
      tags: [Edge Server]
      summary: newmine HFP 麦克风状态
      description: |
        返回蓝牙耳机麦克风的 HFP 能力、输入源、录音状态、最近录音和音量。
        `available=true` 表示音箱已连接且 card 提供 `headset-head-unit` profile；
        录音时临时切到 HFP，`recording=true`；停止后自动恢复 A2DP。
      operationId: edgeMicrophoneStatus
      responses:
        '200':
          description: 麦克风状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeMicrophoneStatus'
        '503':
          description: 麦克风功能未启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/microphone/{action}:
    post:
      tags: [Edge Server]
      summary: 麦克风操作（开始/停止录音、回放、音量、列表）
      description: |
        - `start`：`{"duration":10}` 开始录音；省略 duration 用 `max_duration_sec`；
        - `stop`：停止录音并恢复 A2DP；
        - `play`：`{"file":"mic-....wav"}` 回放录音；
        - `volume`：`{"volume":100}` 麦克风音量 0..100；
        - `gain`：`{"gain":3.0}` 软件增益 1.0..8.0（HFP 麦克风偏小时使用）；
        - `list`：返回录音文件列表。
      operationId: edgeMicrophoneAction
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, play, volume, gain, list]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 操作已接受（`microphone` 为最新状态）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 参数非法（时长/音量/文件名等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '404':
          description: 未知麦克风动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '503':
          description: 麦克风未启用或音箱不支持 HFP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/microphone/recordings:
    get:
      tags: [Edge Server]
      summary: 录音文件列表
      operationId: edgeMicrophoneRecordings
      responses:
        '200':
          description: '`{ok,count,recordings,dir}`，按修改时间倒序'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: 麦克风功能未启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/microphone/recordings/{name}:
    get:
      tags: [Edge Server]
      summary: 下载 WAV 录音
      operationId: edgeMicrophoneRecordingDownload
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}\.wav$'
      responses:
        '200':
          description: WAV 文件
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '404':
          description: 录音不存在或文件名非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '503':
          description: 麦克风功能未启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/power:
    get:
      tags: [Edge Server]
      summary: 树莓派电源/欠压监控
      description: |
        读取 `vcgencmd get_throttled` 与 `rpi_volt/in0_lcrit_alarm`，代表
        “电源及转换板”硬件模块状态。当前欠压 → `error`；当前降频/温度限制 →
        `degraded`；仅历史位 → `status=ok, warning=true`（当前已恢复）。
      operationId: edgePowerStatus
      responses:
        '200':
          description: 电源状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePowerStatus'
        '503':
          description: 电源监控不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/modules/report:
    post:
      tags: [Edge Server]
      summary: 模块状态上报（CENTER 等外部模块）
      description: |
        CENTER 等外部模块连接 RUSH-MOG Wi-Fi/局域网后，由 `software/tools/edge_link.py`
        周期调用。ROS 2 已与 Edge Server 同机，由 `edge_server_node` 本地读取，
        不再通过本接口上报。使用 `application/x-www-form-urlencoded`，字段小；
        模块 IP 以连接来源 `remoteIP` 为准，不信任客户端传入；
        `edge`/`ros` 为保留 ID，外部模块不能用这两个 ID 上报。
      operationId: edgeModuleReport
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EdgeModuleReport'
      responses:
        '200':
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: module/端口/路径非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'
        '507':
          description: 注册表已满（最多 8 个模块）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CenterErrorResponse'

  /api/modules/{module_id}:
    get:
      tags: [Edge Server]
      summary: 单模块缓存
      description: 返回模块最近一次上报的缓存；`edge` 返回 Pi 本地状态，`ros` 返回同机 ROS 子系统。
      operationId: edgeModule
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            enum: [edge, ros, center]
      responses:
        '200':
          description: 模块状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeModule'
        '404':
          description: 模块尚未上报
          content:
            application/json:
              schema:
