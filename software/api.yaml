openapi: 3.0.3

info:
  title: Rush-MOG 模块接口
  version: 1.2.0
  description: |
    Rush-MOG 各模块接口归档，按模块分组：

    | 模块 | 传输 | 入口 | 说明 |
    | --- | --- | --- | --- |
    | **Edge Server** | HTTP | `http://192.168.4.1`（80） | ESP32-S3 网页手柄、数字孪生监控/配置、模块上报/代理、静态资源、MJPEG 图传 |
    | **Center Server** | HTTP | `http://127.0.0.1:8000` | SmolVLA 多模态推理、健康检查、模型/参数信息 |
    | **ROS Health Gateway** | HTTP | `http://127.0.0.1:8090` | ROS/设备健康检查，供 edge_center 调用 |
    | **Body Control** | UART | STM32 USART3，9600 8N1 | ESP32-S3 → STM32 的 ASCII 运动/音频命令，无 ACK |

    > **ROS 说明**：`software/ros` 的 ROS 2 话题/服务/Action 不是 HTTP，
    > 未纳入本 OpenAPI 文件，详见 `software/ros/README.md`。
    > `health_monitor_node` 额外提供 HTTP 健康网关，归档在下方
    > `ROS Health Gateway` 分组，完整契约见 `software/ros/HEALTHCHECK.md`。
    >
    > **UART 说明**：OpenAPI/Swagger 只原生描述 HTTP。本文档用
    > `/body-control/uart/command` 作为**虚拟归档路径**，并在
    > `x-body-control-uart` 中给出完整 UART 帧格式、命令表和 ACK 行为。
    > 该路径不是 HTTP 端点，请勿用 Swagger “Try it out” 调用。

    详细文档：
    - Edge Server：`software/edge_server/README.md`
    - Center Server：`software/center_server/README.md`、`DESIGN.md`
    - ROS Health Gateway：`software/ros/HEALTHCHECK.md`
    - Body Control：`software/body_control/README.md`

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: "http://192.168.4.1"
    description: Edge Server（ESP32-S3 AP，HTTP 80）

# Edge/UART/健康检查默认匿名；Center 受保护端点在各 operation 上覆盖为可选鉴权
security: []

tags:
  - name: Edge Server
    description: |
      ESP32-S3 车载上位机。手机连接 `RUSH-MOG` Wi-Fi 后访问
      `http://192.168.4.1`。80 端口负责网页/静态文件/控制/状态/模块监控 API，
      8080 端口负责 MJPEG 图传。控制命令最终通过 UART 转发给 STM32。

      数字孪生页面：`GET /dashboard.html`（手柄页点 RUSH-MOG TWIN）。
      ROS/CENTER 连上 AP 后向 `/api/modules/report` 上报，页面通过
      `/api/modules/{id}/health|params` 由 ESP32 代理访问模块。
    x-docs: "./edge_server/README.md"
  - name: Center Server
    description: |
      独立部署的 SmolVLA 中心推理服务，默认监听 `0.0.0.0:8000`。
      车载 ROS 通过 `POST /v1/infer` 发送语言指令/图像/本体状态，
      服务返回动作块及第一步映射后的底盘/机械臂命令。
      本服务不直接控制 STM32。

      中心服务的 `GET /` 服务信息因与 Edge Server 的 `GET /` 冲突，
      不单独占用 path，见 `x-center-server.root_response`；CORS 见
      `x-center-server.cors`。
    x-docs: "./center_server/README.md"
  - name: ROS Health Gateway
    description: |
      `software/ros` 的 `health_monitor_node` 内嵌 HTTP 网关，默认
      `127.0.0.1:8090`。返回 ROS 节点/话题状态，以及相机、雷达、IMU、
      麦克风、音箱、机械臂、底盘、电池、里程计等设备的健康情况。
      只读接口；默认仅回环，跨机调用需设置 `health.http.api_key`。
      主路径为 `/ros/health`，同时保留 `/v1/health`、`/health` 别名。
    x-docs: "./ros/HEALTHCHECK.md"
  - name: Body Control (UART)
    description: |
      STM32F103C8T6 车体控制器的 UART 命令协议。ESP32-S3 UART1
      （GPIO19 TX / GPIO20 RX）连接 STM32 USART3（PB10 TX / PB11 RX），
      9600 8N1，命令以 `\n` 结束。命令无 ACK；USART3 会周期回传编码器遥测，ESP32 通过 `/api/body` 暴露。
    x-docs: "./body_control/README.md"

x-tagGroups:
  - name: 车载控制
    tags:
      - Edge Server
      - ROS Health Gateway
      - Body Control (UART)
  - name: 中心推理
    tags:
      - Center Server

x-modules:
  - id: edge_server
    name: Edge Server
    transport: http
    base_url: "http://192.168.4.1"
    ports:
      http: 80
      mjpeg: 8080
    source:
      - "edge_server/src/main.cpp"
      - "edge_server/src/web.cpp"
      - "edge_server/src/serial.cpp"
  - id: center_server
    name: Center Server
    transport: http
    base_url: "http://127.0.0.1:8000"
    source:
      - "center_server/center_server/http_api.py"
      - "center_server/center_server/service.py"
      - "center_server/center_server/engine.py"
  - id: body_control
    name: Body Control
    transport: uart
    source:
      - "body_control/src/src/ps2_receiver.c"
      - "body_control/src/src/controller.c"
      - "body_control/src/inc/command.h"
  - id: ros_health
    name: ROS Health Gateway
    transport: http
    base_url: "http://127.0.0.1:8090"
    ports:
      http: 8090
    source:
      - "ros/ros_nodes/health_monitor_node.py"
      - "ros/center_server/core/health_monitor.py"
      - "ros/center_server/http_health.py"
    docs: "ros/HEALTHCHECK.md"

x-edge-network:
  mode: AP
  ssid: "RUSH-MOG"
  ip: "192.168.4.1"
  gateway: "192.168.4.1"
  subnet: "255.255.255.0"
  channel: 6
  max_clients: 4
  ports:
    http: 80
    mjpeg: 8080
  note: "手机连接该 AP 后打开 http://192.168.4.1 进入 PS2 手柄页面。"

x-edge-http:
  method_filtering: |
    只有 `POST /cmd` 在 ESP32 代码中限定为 POST；`/cmd-button`、`/cmd-stick`、
    `/stop`、`/status`、`/stream` 使用 `server.on(uri, handler)` 注册，
    未限制 HTTP 方法。本文档按页面实际用法记录为 GET。
  note: "控制类请求建议仍使用文档中的方法，避免中间代理/浏览器行为差异。"

x-edge-motion-keepalive:
  interval_ms: 200
  sustained_commands:
    - "1..9"
    - "A"
    - "B"
    - "C"
    - "two-byte stick commands, e.g. 15"
  clear_commands:
    - "0"
    - "J"
    - "D"
  behavior: |
    ESP32 保存当前持续运动命令，默认每 200ms 重发给 STM32（dashboard 可配 100–600ms）；两字节摇杆命令
    只重发方向位（如 15 → 1），避免覆盖之后调整的 PWM/微调。
    收到 0 / J / D 或调用 POST /stop 后清除。
  warning: |
    如果客户端只发送按下命令而未发送松开/停止命令，ESP32 会保持最后一条
    运动命令；页面隐藏/关闭时应发送 button:stop:down 或 POST /stop。

x-edge-command-mapping:
  note: |
    HTTP 控制消息到 STM32 UART 命令的映射（与 edge_server/src/web.cpp 一致）。
    `down` 为按下事件，`up` 为松开事件；null 表示松开时不发送命令。
  button:
    up:
      down: "1"
      up: "0"
    down:
      down: "2"
      up: "0"
    left:
      down: "3"
      up: "0"
    right:
      down: "4"
      up: "0"
    triangle:
      down: "E"
      up: null
    cross:
      down: "F"
      up: null
    square:
      down: "G"
      up: "I"
    circle:
      down: "H"
      up: "I"
    l1:
      down: "9"
      up: "0"
    r1:
      down: "A"
      up: "0"
    l2:
      down: "B"
      up: "0"
    r2:
      down: "C"
      up: "0"
    start:
      down: "D"
      up: null
    select:
      down: "J"
      up: null
    stop:
      down: "0"
      up: "0"
  stick:
    stickId: "left-analog"
    format: "{direction_prefix}{stepValue}"
    directions:
      up: "1"
      down: "2"
      left: "3"
      right: "4"
      uple: "5"
      uprt: "6"
      dnle: "7"
      dnrt: "8"
    stop: "0"
    zero_step: "0"

x-edge-mjpeg:
  port: 8080
  path: "/stream"
  content_type: "multipart/x-mixed-replace; boundary=frame"
  frame:
    headers:
      - "Content-Type: image/jpeg"
      - "Content-Length: <jpeg_bytes>"
    prefix: '--frame\r\n'
    separator: '\r\n\r\n'
    trailer: '\r\n'
  resolution: "320x240 (QVGA)"
  jpeg_quality: 12
  target_fps: 20
  notes:
    - "端口 80 的 /stream 返回 302 到 8080。"
    - "摄像头未就绪时端口 8080 返回 503，无响应体。"
    - "新连接会接管旧连接，避免多路流抢帧。"

x-center-server:
  service: "rush-mog-center-server"
  version: "0.1.0"
  default_base_url: "http://127.0.0.1:8000"
  transport: http-json
  auth:
    optional: true
    note: "仅当 server.api_key 非空时启用；支持 Bearer 或 X-API-Key。"
    schemes:
      - centerBearer
      - centerApiKey
    protected_paths:
      - "/v1/infer"
      - "/v1/reset"
      - "/v1/warmup"
      - "/v1/model"
    public_paths:
      - "/v1/health"
      - "/v1/healthz"
      - "/health"
      - "/v1/ready"
      - "/readyz"
      - "/healthz"
      - "/livez"
  limits:
    instruction_max_chars: 512
    max_images: 8
    max_body_bytes: 16777216
    max_image_bytes: 6291456
    max_image_pixels: 25000000
    chunk_size:
      min: 1
      max: 1000
    inference_concurrency: "单进程串行（引擎 RLock）"
  cors:
    allow_methods: ["GET", "POST", "OPTIONS"]
    allow_headers: ["Content-Type", "Authorization", "X-API-Key", "X-Request-ID"]
    expose_headers: ["X-Request-ID"]
    allow_origin: "server.cors_allow_origin（默认 *）"
  root_response:
    description: "GET / 的服务信息响应；为避免与 Edge Server 的 GET / 冲突，不单独占用 OpenAPI path。"
    value:
      ok: true
      service: "rush-mog-center-server"
      version: "0.1.0"
      status: "ok"
      endpoints:
        health: "GET /v1/health"
        ready: "GET /v1/ready"
        model: "GET /v1/model"
        infer: "POST /v1/infer"
        reset: "POST /v1/reset"
        warmup: "POST /v1/warmup"

x-body-control-uart:
  module: Body Control
  mcu: STM32F103C8T6
  link:
    stm32_usart: USART3
    stm32_pins: "PB10 TX / PB11 RX"
    peer: "ESP32-S3 UART1"
    peer_pins: "GPIO19 TX / GPIO20 RX"
    baudrate: 9600
    data_bits: 8
    parity: none
    stop_bits: 1
    flow_control: none
    electrical: "3.3V TTL（共地）"
  framing:
    format: "<command_id>[<second_byte>]\\n"
    terminators: ["\\n", "\\r"]
    recommended_terminator: "\\n"
    warning: "不要发送 \\r\\n：固件在 \\r 或 \\n 处都会结束当前帧。"
    max_command_bytes: 2
    receive_buffer_bytes: 4
    note: "命令超过 2 字节时固件只取前 2 字节；超过 4 字节接收缓冲会回绕。"
  ack:
    supported: false
    response: "无"
    note: |
      STM32 不返回命令 ACK，uart_log 输出已关闭。
      USART3 上会周期发送编码器遥测（STM32 -> ESP32）：
      $B,<seq>,<uptime_ms>,<fl>,<fr>,<rl>,<rr>,<distance_mm>\n
      轮速单位 mm/s，里程单位 mm；ESP32 解析后通过 GET /api/body
      和 GET /api/modules 的 edge.body 暴露。
  second_byte:
    motion_direct: "0-9/A/B/C/D 命令可带 1 位 PWM：0=停，1..9 对应约 11%..100% 占空比。"
    audio_play: "P 命令可带 1 位曲目索引 1..9；不带则播放 V8_STOP（索引 1）。"
    audio_other: "K/L/M/N/O 的第二字节被忽略。"
    speed_trim: "E/F/G/H/I 的第二字节被忽略。"
    reset: "J 的第二字节被忽略。"
  implementation_notes:
    - "K-P 音频命令由 Body Control 支持，但当前 edge_server 的 /cmd 映射未使用这些命令。"
    - "MODULE_ARM_BOT 在命令表中没有对应命令 ID；arm_roboot_executor.update_state 当前为空实现。"
  related_uarts:
    - name: "JQ6500 音频模块"
      usart: "USART2"
      baudrate: 9600
      direction: "STM32 → JQ6500"
      note: "内部音频链路，不属于整车控制接口。"
  commands:
    - id: "0"
      name: "stop"
      module: "motor_direct"
      description: "停止；清空持续运动。"
      second_byte: "PWM 0-9（一般不带）"
    - id: "1"
      name: "forward"
      module: "motor_direct"
      description: "前进。"
      second_byte: "PWM 0-9"
    - id: "2"
      name: "backward"
      module: "motor_direct"
      description: "后退。"
      second_byte: "PWM 0-9"
    - id: "3"
      name: "strafe_left"
      module: "motor_direct"
      description: "向左横向移动。"
      second_byte: "PWM 0-9"
    - id: "4"
      name: "strafe_right"
      module: "motor_direct"
      description: "向右横向移动。"
      second_byte: "PWM 0-9"
    - id: "5"
