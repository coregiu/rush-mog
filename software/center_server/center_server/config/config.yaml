vla_engine:
  model_name: "vla_policy_v1"
  inference_rate: 10
  confidence_threshold: 0.6
  device: "cuda"
  max_queue_size: 5

action_generator:
  max_linear_speed: 0.8
  max_angular_speed: 1.0
  acceleration_limit: 0.3

reverse_operation:
  reverse_speed: 0.3
  reverse_distance: 0.5
  emergency_stop_on_high_risk: true

safety:
  obstacle_stop_distance: 0.5
  max_twist_x: 1.0
  max_twist_z: 1.5

time_sync:
  sync_window_ms: 50
